name: Deploy to server (SSH / rsync)

# Pushes the Mister Szoko site to the client's server over SSH (rsync):
#   /mrszoko/backoffice  ← the Console marque (Claude Design "DC" export run
#                          natively) + its PHP API at ./api
#   /mrszoko/landing     ← the Mister Szoko landing page (design-system tokens)
#   /mrszoko/            ← redirects to the landing
#
# ─── One-time setup (GitHub → Settings → Secrets and variables → Actions) ─────
#   Secrets (same names as before):
#     SSH_HOST       server IP/host, e.g. 185.180.206.46
#     SSH_USER       ssh user (dedicated deploy user recommended)
#     SSH_PASSWORD   that user's password
#   Optional variables:
#     SSH_PORT       ssh port (default 22)
#     DEPLOY_DIR     absolute server dir mapped to the URL /mrszoko
#                    (default /var/www/html/mrszoko)
#
#   Notes:
#   • rsync runs WITHOUT --delete, so nothing else on the server is wiped.
#     A dedicated post-verify step removes the OLD flat layout (the app used to
#     live directly at /mrszoko/) — explicit whitelist, see below.
#   • SECURITY: prefer a dedicated non-root deploy user + SSH key over the root
#     password (replace the sshpass lines with an ssh-agent key, drop SSH_PASSWORD).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site (backoffice + landing)
        run: |
          rm -rf site && mkdir -p site/backoffice site/landing

          # -- Back-office → /mrszoko/backoffice --------------------------------
          BO=mrszoko/backoffice
          cp "$BO"/back_office_ws_franchisor.dc.html "$BO"/api-config.js "$BO"/support.js \
             "$BO"/bo_server.js "$BO"/menu_api.js "$BO"/menu_seed.js site/backoffice/
          cp "$BO"/back_office_ws_franchisor.dc.html site/backoffice/index.html
          cp -r "$BO"/_ds site/backoffice/
          cp -r "$BO"/vendor site/backoffice/
          mkdir -p site/backoffice/img && cp "$BO"/img/logo.png site/backoffice/img/
          # webshop_mrszoko API — deployed as ./api/ because the app (served at
          # /mrszoko/backoffice/) derives its API base as <same-origin>/mrszoko/backoffice/api.
          # The local SQLite database (data/) is regenerated on the server, never shipped.
          rsync -a --exclude 'data' --exclude '*.sqlite' "$BO"/php-api/ site/backoffice/api/

          # -- Landing → /mrszoko/landing ---------------------------------------
          cp -r mrszoko/landing/. site/landing/

          # -- /mrszoko/ → redirect to the landing ------------------------------
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=landing/">
          <title>Mister Szoko</title>
          <link rel="canonical" href="landing/">
          </head><body><p><a href="landing/">Mister Szoko</a></p></body></html>
          HTML

          ls -R site | head -60

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare remote dir + provision MySQL `mrszoko` (validates SSH login)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_DIR='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}' WSM_TOKEN='${{ secrets.WSM_ADMIN_TOKEN }}' bash -s" << 'REMOTE'
          set -e
          DIR="${DEPLOY_DIR:-/var/www/html/mrszoko}"
          API="$DIR/backoffice/api"
          mkdir -p "$API/data"
          chown -R www-data:www-data "$API/data" 2>/dev/null || chmod -R 777 "$API/data"
          command -v rsync >/dev/null || { echo 'rsync manquant sur le serveur — apt-get install -y rsync'; exit 1; }
          # pdo_sqlite = repli dev/CI ; installé au run #10, on vérifie sans réinstaller.
          php -m 2>/dev/null | grep -qi '^pdo_sqlite' && echo 'pdo_sqlite présent (repli)' || echo 'pdo_sqlite absent (repli indisponible)'
          # ── MySQL : la base du serveur est `mrszoko` (cf. phpMyAdmin). On
          # provisionne UNE FOIS : utilisateur applicatif dédié + config.local.php
          # (engine mysql, base mrszoko, jeton admin). config.local.php est
          # gitignoré, web-denied (.htaccess) et JAMAIS écrasé par rsync — s'il
          # existe déjà, on ne touche à rien.
          if [ -f "$API/config.local.php" ]; then
            echo 'config.local.php présent — conservé tel quel'
          elif command -v mysql >/dev/null && mysql -e 'SELECT 1' >/dev/null 2>&1; then
            PASS=$(openssl rand -hex 16)
            TOKEN="${WSM_TOKEN:-$(openssl rand -hex 24)}"
            mysql -e "CREATE DATABASE IF NOT EXISTS \`mrszoko\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            mysql -e "CREATE USER IF NOT EXISTS 'mrszoko_app'@'localhost' IDENTIFIED BY '$PASS';"
            mysql -e "ALTER USER 'mrszoko_app'@'localhost' IDENTIFIED BY '$PASS';"
            mysql -e "GRANT ALL PRIVILEGES ON \`mrszoko\`.* TO 'mrszoko_app'@'localhost'; FLUSH PRIVILEGES;"
            cat > "$API/config.local.php" <<PHPCONF
          <?php
          // Généré par le déploiement — base MySQL du serveur (phpMyAdmin: mrszoko).
          // Jeton admin : requis en X-Admin-Token pour toute écriture.
          return [
              'engine' => 'mysql',
              'mysql'  => [
                  'host' => '127.0.0.1',
                  'port' => '3306',
                  'name' => 'mrszoko',
                  'user' => 'mrszoko_app',
                  'pass' => '$PASS',
              ],
              'admin_token' => '$TOKEN',
          ];
          PHPCONF
            chown www-data:www-data "$API/config.local.php" 2>/dev/null || true
            chmod 640 "$API/config.local.php" || true
            echo 'config.local.php créé — API branchée sur MySQL mrszoko (utilisateur mrszoko_app)'
          else
            echo 'MySQL non joignable en root (socket) — API laissée sur SQLite. Créez config.local.php à la main (cf. config.local.sample.php).'
          fi
          REMOTE

      - name: Deploy → ${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltDz --omit-dir-times \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/"

      - name: Verify backoffice + landing on the server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s << 'REMOTE'
          fail=0
          run() { URL="$1"; MIN="${2:-1}"
            out=$(curl -s -o /dev/null -w "%{http_code}|%{size_download}|%{content_type}" "$URL")
            IFS='|' read -r code size type <<< "$out"
            size="${size%.*}"
            echo "  $code  $type  ${size}b  $URL"
            if [ "$code" != "200" ] || [ "${size:-0}" -lt "$MIN" ]; then
              echo "  ^ NOT OK — corps de la réponse :"
              curl -s "$URL" | head -c 300; echo
              fail=1
            fi
          }
          BO="http://localhost/mrszoko/backoffice"
          LP="http://localhost/mrszoko/landing"
          DS="_ds/l-atelier-by-8504a4e3-7796-44da-b087-3fbd9dcb8dcd"
          echo "== backoffice =="
          for f in / /api-config.js /support.js /bo_server.js /menu_api.js /menu_seed.js \
                   /vendor/react.js /vendor/react-dom.js \
                   "/$DS/global.css" "/$DS/_ds_bundle.js" \
                   "/$DS/fonts/Gotham_Book.otf" "/$DS/fonts/Gotham_Medium.otf" \
                   "/$DS/fonts/Gotham_Light.otf" "/$DS/fonts/GC_Vank.ttf"; do
            case "$f" in *fonts/*) run "$BO$f" 1000 ;; *) run "$BO$f" 1 ;; esac
          done
          echo "== landing =="
          run "$LP/" 1000
          run "$LP/app.js" 1000
          run "$LP/content_seed.json" 4000
          run "$LP/tokens.css" 100
          run "$LP/tokens/colors.css" 500
          run "$LP/assets/logo.png" 1000
          echo "== API landing : contenu servi en 3 langues depuis la base =="
          for lg in pl uk en; do run "$BO/api/landing/content?lang=$lg" 2000; done
          echo "== moteur de données (preuve MySQL) =="
          if command -v mysql >/dev/null && mysql -e 'SELECT 1' >/dev/null 2>&1; then
            N=$(mysql -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name LIKE 'wsm_%'" 2>/dev/null || echo 0)
            echo "  tables wsm_ dans MySQL mrszoko : $N"
            if [ "${N:-0}" -lt 15 ]; then echo "  ^ ATTENTION : l'API ne semble pas servir depuis MySQL mrszoko"; fi
          else
            echo "  mysql non joignable depuis root — pas de preuve directe"
          fi
          echo "== racine /mrszoko → redirection landing =="
          run "http://localhost/mrszoko/" 50
          if [ "$fail" = "0" ]; then echo "ALL CHECKS OK"; else echo "CHECK FAILED"; exit 1; fi
          REMOTE

      # Nettoyage transitoire : avant cette version, le back-office était servi À
      # PLAT sous /mrszoko/ (index.html, support.js, api/…). rsync tourne sans
      # --delete, donc ces fichiers resteraient servis à côté du nouveau layout
      # backoffice/ + landing/. On les retire — liste blanche explicite, jamais de
      # rm générique — et SEULEMENT après que la vérif ci-dessus est passée.
      # Idempotent ; l'étape pourra être retirée une fois passée en prod.
      - name: Remove the old flat layout at /mrszoko root (post-verify)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          DIR="${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}"
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s << REMOTE
          set -u
          DIR='$DIR'
          for f in back_office_ws_franchisor.dc.html api-config.js support.js \
                   bo_server.js menu_api.js menu_seed.js .nojekyll \
                   _ds vendor img api mrszoko; do
            if [ -e "\$DIR/\$f" ]; then rm -rf "\${DIR:?}/\$f" && echo "supprimé : \$DIR/\$f"; fi
          done
          echo "reste à la racine :"; ls -1 "\$DIR"
          REMOTE

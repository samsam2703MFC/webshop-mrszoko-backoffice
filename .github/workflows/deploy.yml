name: Deploy to server (SSH / rsync)

# Pushes the Mister Szoko site to the client's server over SSH (rsync):
#   /mrszoko/backoffice  ← the Console marque (Claude Design "DC" export run
#                          natively) + its PHP API at ./api
#   /mrszoko/landing     ← the Mister Szoko landing page (design-system tokens)
#   /mrszoko/shop        ← the online shop: catalogue, basket, checkout, orders
#                          (rendered server-side by PHP from the same database)
#   /mrszoko/            ← redirects to the landing
#
# ─── One-time setup (GitHub → Settings → Secrets and variables → Actions) ─────
#   Secrets (same names as before):
#     SSH_HOST       server IP/host, e.g. 185.180.206.46
#     SSH_USER       ssh user (dedicated deploy user recommended)
#     SSH_PASSWORD   that user's password
#   Optional variables:
#     SSH_PORT       ssh port (default 22)
#     DEPLOY_DIR     absolute server dir mapped to the URL /mrszoko
#                    (default /var/www/html/mrszoko)
#
#   Notes:
#   • rsync runs WITHOUT --delete, so nothing else on the server is wiped.
#     A dedicated post-verify step removes the OLD flat layout (the app used to
#     live directly at /mrszoko/) — explicit whitelist, see below.
#   • SECURITY: prefer a dedicated non-root deploy user + SSH key over the root
#     password (replace the sshpass lines with an ssh-agent key, drop SSH_PASSWORD).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (backoffice + landing + shop)
        run: |
          rm -rf site && mkdir -p site/backoffice site/landing

          # -- Back-office → /mrszoko/backoffice --------------------------------
          BO=mrszoko/backoffice
          # LA CONSOLE DE FRANCHISE EXPORTÉE N'EST PLUS DÉPLOYÉE.
          #
          # Elle pesait 1,2 Mo de React plus six fichiers de script, et une
          # fois identifié son portier JavaScript renvoyait aussitôt vers
          # pulpit.php : l'application entière ne servait qu'à porter un
          # formulaire de connexion. Ce formulaire est désormais login.php,
          # rendu par le serveur — donc la porte ne dépend plus qu'un script
          # veuille bien se charger.
          #
          # Ce qui reste est ce dont les écrans PHP se servent VRAIMENT : les
          # feuilles du design system et le logo.
          cp -r "$BO"/_ds site/backoffice/
          mkdir -p site/backoffice/img && cp "$BO"/img/logo.png site/backoffice/img/
          # Une adresse partagée ou mise en favori pointe encore sur index.html.
          # On la garde donc, réduite à ce qu'elle doit faire : renvoyer vers la
          # porte. Sans JavaScript, pour la même raison que login.php.
          cat > site/backoffice/index.html <<'HTML'
          <!doctype html><html lang="pl"><head><meta charset="utf-8">
          <meta name="robots" content="noindex, nofollow">
          <meta http-equiv="refresh" content="0; url=login.php">
          <title>Konsola Mister Szoko</title></head>
          <body><p><a href="login.php">Przejdź do logowania</a></p></body></html>
          HTML
          # webshop_mrszoko API — deployed as ./api/ because the app (served at
          # /mrszoko/backoffice/) derives its API base as <same-origin>/mrszoko/backoffice/api.
          # The local SQLite database (data/) is regenerated on the server, never shipped.
          rsync -a --exclude 'data' --exclude '*.sqlite' "$BO"/php-api/ site/backoffice/api/

          # -- Landing → /mrszoko/landing ---------------------------------------
          cp -r mrszoko/landing/. site/landing/

          # -- Boutique → /mrszoko/shop -----------------------------------------
          # Rendue par PHP depuis la base (voir mrszoko/shop/index.php). On ne
          # copie pas les outils de développement : router.php et serve.sh ne
          # servent qu'au serveur intégré de PHP, qui n'existe pas ici.
          mkdir -p site/shop
          rsync -a --exclude 'router.php' --exclude 'serve.sh' mrszoko/shop/. site/shop/
          cp mrszoko/shop/.htaccess site/shop/.htaccess

          # Les jetons du design system sont RÉGÉNÉRÉS depuis la source, en un
          # seul fichier : ils ne peuvent donc pas diverger, et la page n'a pas
          # à découvrir six feuilles en cascade avant d'afficher un texte.
          {
            echo "/* Généré au déploiement depuis design-system/tokens/*.css — ne pas éditer. */"
            for f in colors typography spacing radius shadow motion fonts; do
              echo ""; echo "/* ---- $f ---- */"
              grep -v "^@import" "mrszoko/design-system/tokens/$f.css"
            done
          } > site/shop/tokens.css
          test -s site/shop/tokens.css && grep -q -- '--choco-700' site/shop/tokens.css \
            || { echo "tokens.css régénéré vide ou incomplet"; exit 1; }

          # Écrans PHP autonomes de la console (même session, mêmes rôles).
          # Le fichier exporté par Claude Design n'est pas touché — un patch à
          # la main le rendrait irrécupérable au prochain export.
          #
          # CECI ÉTAIT UNE LISTE ÉCRITE À LA MAIN, ET ELLE A COÛTÉ CHER.
          # Sept écrans livrés entre-temps — Subskrypcje, Zgłoszenia, Kampanie,
          # Wysyłka, Allegro, Przypomnienia, KSeF — n'y avaient jamais été
          # ajoutés. Ils existaient dans le dépôt, le rail y menait, et en
          # production ils répondaient 301 : six d'entre eux étaient morts
          # depuis leur mise en ligne sans que rien ne le dise. Une liste
          # blanche qu'il faut penser à tenir à jour n'est pas un contrôle,
          # c'est un piège à retardement.
          #
          # On copie donc TOUT le PHP de ce répertoire. Les sous-répertoires
          # (php-api/) sont traités plus haut par leur propre rsync ; le glob
          # ne descend pas.
          cp mrszoko/backoffice/*.php mrszoko/backoffice/console.css site/backoffice/

          # ET ON VÉRIFIE QUE LE RAIL NE MÈNE NULLE PART DE VIDE. Le menu est
          # la seule source de vérité de ce qui doit exister : chaque entrée
          # doit correspondre à un fichier réellement assemblé. Un écran ajouté
          # au rail et oublié à la copie casse ici, au build, et pas devant un
          # client trois semaines plus tard.
          php -r '
            require_once "mrszoko/backoffice/console.php";
            $manque = [];
            foreach (console_sections(["role" => "Centrala"]) as $items) {
              foreach (array_keys($items) as $f) {
                if (!is_file("site/backoffice/" . $f)) $manque[] = $f;
              }
            }
            if ($manque) { fwrite(STDERR, "ÉCRANS DU RAIL NON ASSEMBLÉS : " . implode(", ", $manque) . "\n"); exit(1); }
            echo "rail vérifié : chaque entrée du menu a son fichier\n";
          '

          # Le lanceur console-nav.js n'existe plus : il injectait la navigation
          # des écrans PHP dans la console exportée, qui n'est plus déployée.

          # La porte doit être là, et elle doit mener quelque part. Une console
          # sans page de connexion, c'est un back-office inaccessible — et rien
          # d'autre dans le déploiement ne s'en apercevrait.
          test -s site/backoffice/login.php \
            || { echo "login.php absent de l'assemblage : personne ne pourrait entrer"; exit 1; }
          grep -q 'login.php' site/backoffice/index.html \
            || { echo "index.html ne renvoie pas vers login.php"; exit 1; }

          # Dossier des photos envoyées depuis la console. Il ne contient que
          # son .htaccess : rsync tourne sans --delete, donc les photos déjà
          # présentes sur le serveur survivent au déploiement.
          mkdir -p site/shop/media
          cp mrszoko/shop/media/.htaccess site/shop/media/.htaccess

          # -- En-têtes de sécurité à la racine du site --------------------------
          cp mrszoko/.htaccess site/.htaccess

          # -- /mrszoko/ → la boutique, qui EST désormais le site public --------
          # La page de marque et la boutique n'en font plus qu'une : /landing
          # reste vivante (elle a été partagée) mais ne fait que rediriger.
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="pl"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=shop/">
          <title>Mister Szoko</title>
          <link rel="canonical" href="shop/">
          </head><body><p><a href="shop/">Mister Szoko</a></p></body></html>
          HTML

          ls -R site | head -60

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare remote dir + provision MySQL `mrszoko` (validates SSH login)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_DIR='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}' WSM_TOKEN='${{ secrets.WSM_ADMIN_TOKEN }}' DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' bash -s" << 'REMOTE'
          set -e
          DIR="${DEPLOY_DIR:-/var/www/html/mrszoko}"
          API="$DIR/backoffice/api"
          mkdir -p "$API/data"
          chown -R www-data:www-data "$API/data" 2>/dev/null || chmod -R 777 "$API/data"
          # Photos produit : c'est le serveur web qui écrit ici, pas le déploiement.
          mkdir -p "$DIR/shop/media"
          chown -R www-data:www-data "$DIR/shop/media" 2>/dev/null || chmod -R 775 "$DIR/shop/media"
          command -v rsync >/dev/null || { echo 'rsync manquant sur le serveur — apt-get install -y rsync'; exit 1; }
          # pdo_sqlite = repli dev/CI ; installé au run #10, on vérifie sans réinstaller.
          php -m 2>/dev/null | grep -qi '^pdo_sqlite' && echo 'pdo_sqlite présent (repli)' || echo 'pdo_sqlite absent (repli indisponible)'
          # ── MySQL : la base du serveur est `mrszoko` (cf. phpMyAdmin). On
          # provisionne UNE FOIS : utilisateur applicatif dédié + config.local.php
          # (engine mysql, base mrszoko, jeton admin). config.local.php est
          # gitignoré, web-denied (.htaccess) et JAMAIS écrasé par rsync — s'il
          # existe déjà, on ne touche à rien.
          write_conf() { # write_conf <user> <pass>
            TOKEN="${WSM_TOKEN:-$(openssl rand -hex 24)}"
            cat > "$API/config.local.php" <<PHPCONF
          <?php
          // Généré par le déploiement — base MySQL du serveur (phpMyAdmin: mrszoko).
          // Jeton admin : requis en X-Admin-Token pour toute écriture.
          return [
              'engine' => 'mysql',
              'mysql'  => [
                  'host' => '127.0.0.1',
                  'port' => '3306',
                  'name' => 'mrszoko',
                  'user' => '$1',
                  'pass' => '$2',
              ],
              'admin_token' => '$TOKEN',
          ];
          PHPCONF
            chown www-data:www-data "$API/config.local.php" 2>/dev/null || true
            chmod 640 "$API/config.local.php" || true
          }
          if [ -f "$API/config.local.php" ]; then
            echo 'config.local.php présent — conservé tel quel'
          elif [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            # Identifiants fournis via les secrets GitHub WSM_DB_USER / WSM_DB_PASS.
            mysql -u"$DB_USER" -p"$DB_PASS" -e "CREATE DATABASE IF NOT EXISTS \`mrszoko\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" 2>/dev/null \
              || mysql -u"$DB_USER" -p"$DB_PASS" -e "USE \`mrszoko\`" \
              || { echo 'La base mrszoko est inaccessible avec ces identifiants'; exit 1; }
            write_conf "$DB_USER" "$DB_PASS"
            echo 'config.local.php créé — API branchée sur MySQL mrszoko (identifiants des secrets)'
          elif command -v mysql >/dev/null && mysql -e 'SELECT 1' >/dev/null 2>&1; then
            # Accès socket root : utilisateur applicatif dédié.
            PASS=$(openssl rand -hex 16)
            mysql -e "CREATE DATABASE IF NOT EXISTS \`mrszoko\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            mysql -e "CREATE USER IF NOT EXISTS 'mrszoko_app'@'localhost' IDENTIFIED BY '$PASS';"
            mysql -e "ALTER USER 'mrszoko_app'@'localhost' IDENTIFIED BY '$PASS';"
            mysql -e "GRANT ALL PRIVILEGES ON \`mrszoko\`.* TO 'mrszoko_app'@'localhost'; FLUSH PRIVILEGES;"
            write_conf 'mrszoko_app' "$PASS"
            echo 'config.local.php créé — API branchée sur MySQL mrszoko (utilisateur mrszoko_app)'
          else
            echo 'MySQL inaccessible (ni secrets WSM_DB_USER/WSM_DB_PASS valides, ni socket root) — API laissée sur SQLite.'
            echo 'Ajoutez les secrets GitHub WSM_DB_USER / WSM_DB_PASS (identifiants phpMyAdmin) puis relancez le déploiement.'
          fi
          REMOTE

      - name: Deploy → ${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltDz --omit-dir-times \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/"

          # LA CONSOLE DE FRANCHISE, RETIRÉE DU SERVEUR.
          #
          # rsync tourne SANS --delete — volontairement, pour que les photos
          # envoyées depuis la console survivent au déploiement. Conséquence :
          # cesser de copier un fichier ne le retire pas de là-bas. Les 1,2 Mo
          # de React continueraient d'être servis, et l'ancienne porte avec eux.
          #
          # Liste blanche explicite, jamais un rm générique : ce répertoire
          # contient aussi tous les écrans PHP. C'est fait ICI, avec le
          # déploiement, et pas dans le nettoyage de fin — les vérifications
          # qui suivent doivent voir le serveur tel qu'il sera.
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "BO='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice' bash -s" << 'REMOTE'
          set -u
          for f in back_office_ws_franchisor.dc.html support.js bo_server.js \
                   menu_api.js menu_seed.js auth-gate.js console-nav.js api-config.js vendor; do
            if [ -e "$BO/$f" ]; then rm -rf "${BO:?}/$f" && echo "  retiré : $f"; fi
          done
          echo "  console : $(ls -1 "$BO" | wc -l) entrées restantes"
          REMOTE

      # Amorçage du compte de connexion + HTTPS. Après le rsync : migrate.php et
      # config.local.php doivent être en place.
      - name: Bootstrap admin account + enforce HTTPS (if TLS works)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_DIR='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}' ADM_EMAIL='${{ secrets.WSM_ADMIN_EMAIL }}' ADM_PASS='${{ secrets.WSM_ADMIN_PASSWORD }}' SUPER_MAILS='${{ secrets.WSM_SUPERADMIN_EMAILS }}' SUPER_CODE='${{ secrets.WSM_SUPERADMIN_CODE }}' DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' bash -s" << 'REMOTE'
          set -e
          DIR="${DEPLOY_DIR:-/var/www/html/mrszoko}"
          API="$DIR/backoffice/api"

          # ── QUI EST SUPERADMIN — et pourquoi ça ne marchait pas ───────────
          #
          # config.php lit `superadmin_emails` dans getenv('WSM_SUPERADMIN_EMAILS').
          # Un secret GitHub n'existe QUE pendant le déploiement : PHP-FPM ne
          # le voit jamais. Et config.local.php, où le réglage aurait sa
          # place, est écrit une seule fois puis jamais réécrit — il ne
          # contenait donc pas la clé, et ne l'aurait jamais contenue.
          #
          # Résultat : personne ne pouvait devenir superadmin. Le rôle en base
          # n'aide pas — seul un Superadmin en désigne un autre (règle voulue,
          # pour qu'un compte Administrator compromis ne se hisse pas jusqu'à
          # sa propre facturation). Sans amorçage, la porte n'avait plus de
          # clé du tout, et l'écran de la plateforme était inatteignable.
          #
          # On dépose donc la clé DANS config.local.php, une fois, sans
          # toucher au reste du fichier. Celui qui détient ce secret peut déjà
          # déployer le code qu'il veut sur ce serveur : ça n'ouvre aucun
          # pouvoir nouveau, ça rend seulement joignable ce qui était prévu.
          # Une seule mécanique pour les deux réglages : déposer une clé dans
          # config.local.php si elle n'y est pas, sans toucher au reste, et
          # annuler si le fichier ne se parse plus après coup.
          poser_cle() {   # poser_cle <clé> <valeur> <phrase si posée> <phrase si absente>
            if [ -z "${2:-}" ]; then echo "$4"; return; fi
            if [ ! -f "$API/config.local.php" ]; then
              echo "  ^ ATTENTION : config.local.php absent — $1 non posé"; return
            fi
            if grep -q "$1" "$API/config.local.php"; then
              echo "$1 : déjà réglé dans config.local.php — laissé tel quel"; return
            fi
            if ! grep -q "^\s*\];\s*$" "$API/config.local.php"; then
              # On n'insère QUE dans un fichier de la forme attendue, celle que
              # write_conf() produit. Un fichier édité à la main garde la
              # priorité sur nous : on préfère ne rien faire et le dire.
              echo "  ^ ATTENTION : config.local.php n'a pas la forme attendue — rien touché"; return
            fi
            ESC=$(printf '%s' "$2" | sed "s/'/\\\\'/g")
            sed -i "0,/^\s*\];\s*$/s##    '$1' => '$ESC',\n];#" "$API/config.local.php"
            if php -l "$API/config.local.php" >/dev/null 2>&1; then
              echo "$3"
            else
              echo "  ^ ATTENTION : config.local.php ne se parse plus — annulation"
              sed -i "/$1/d" "$API/config.local.php"
            fi
          }
          poser_cle superadmin_emails "${SUPER_MAILS:-}" \
            "superadmin : adresse(s) déposée(s) dans config.local.php" \
            "superadmin : aucun secret WSM_SUPERADMIN_EMAILS — écran Platforma invisible pour tout le monde"
          # Le CODE DU JOUR. Le second verrou de l'écran plateforme. Sa valeur
          # ne doit jamais apparaître dans un journal : on n'imprime que le
          # fait qu'il est posé, jamais ce qu'il vaut.
          poser_cle superadmin_code "${SUPER_CODE:-}" \
            "kod dnia : liczba bazowa zapisana w config.local.php" \
            "kod dnia : brak sekretu WSM_SUPERADMIN_CODE — ekran Platforma bez drugiego zamka"

          # LE SEUL ENDROIT QUI PEUT VRAIMENT VÉRIFIER ÇA, C'EST ICI.
          #
          # Une suite de tests ne sait pas quel nombre est le vrai : elle ne
          # peut que refuser un littéral qui RESSEMBLE à un code. Le
          # déploiement, lui, CONNAÎT le secret — il peut donc chercher
          # exactement celui-là dans le code livré.
          #
          # Ça n'est pas théorique : le premier jet de la suite reprenait le
          # vrai nombre « parce que c'est un test », et un test part sur GitHub
          # comme le reste. Un code publié ne verrouille plus rien.
          if [ -n "${SUPER_CODE:-}" ]; then
            FUITE=$(grep -rlF "$SUPER_CODE" "$DIR/backoffice" "$DIR/shop" 2>/dev/null \
                    | grep -v 'config\.local\.php' | head -3)
            if [ -n "$FUITE" ]; then
              echo "  ^ ZLE : kod dnia znaleziony w WYDANYM kodzie — jest publiczny, nie chroni niczego :"
              printf '%s\n' "$FUITE" | sed 's/^/      /'
              exit 1
            fi
            echo "kod dnia : nie występuje w wydanym kodzie — potwierdzone"
          fi

          # ── Rebranding et contenu éditorial, PAR DU SQL ÉMIS.
          #
          # Ces deux passages appelaient `php migrate.php --rebrand` et
          # `--sync-content`. Le php en ligne de commande de ce serveur n'a pas
          # pdo_mysql — l'étape de vérification le mesure et l'écrit à chaque
          # déploiement — donc ils ne faisaient RIEN, et le `|| echo` avalait
          # l'échec. Des déploiements verts qui ne synchronisaient rien.
          #
          # Émettre du SQL ne demande aucune base : le serveur produit le
          # script, le client mysql l'exécute. Le travail reste décrit une
          # seule fois (seed.php) et rendu de deux façons, plutôt que réécrit
          # en SQL à côté — deux listes auraient divergé au premier libellé
          # ajouté, et c'est la version de production qu'on ne relit jamais.
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            # Rebranding : --force, parce que wsm_params peut ne pas exister
            # sur une base récente. La voie PHP tolère déjà l'absence table par
            # table ; on garde la même indulgence, pas plus.
            (cd "$API" && php migrate.php --rebrand-sql) \
              | mysql -u"$DB_USER" -p"$DB_PASS" --default-character-set=utf8mb4 --force mrszoko 2>/dev/null \
              && echo 'rebranding : joué' \
              || echo 'ATTENTION : rebranding échoué'

            # Rôles : « Centrala »/« Franczyza » venaient de la maquette de
            # franchise. Le nouveau vocabulaire décrit une boutique en ligne,
            # et surtout il n'est plus binaire — quelqu'un qui imprime des
            # étiquettes n'a plus besoin des clés de la facturation.
            (cd "$API" && php migrate.php --roles-sql) \
              | mysql -u"$DB_USER" -p"$DB_PASS" --default-character-set=utf8mb4 mrszoko \
              && echo 'rôles : migrés' \
              || echo 'ATTENTION : migration des rôles échouée'

            # Contenu : PAS de --force. Une erreur ici doit se voir, sinon on
            # retombe exactement dans le silence qu'on vient de réparer.
            # INSERT IGNORE porte la règle : la clé primaire est (lang, k),
            # donc un libellé retouché en console est laissé intact.
            # ON GARDE CE QUE MYSQL A DIT. Au déploiement 90 ce lot est tombé
            # entier — le SQL nommait une colonne que la base n'avait pas encore
            # — et la seule trace était « synchronisation échouée », sans la
            # raison. Il a fallu la déduire. La raison tient en une ligne : on
            # l'imprime, et la prochaine fois elle sera là.
            if OUT_SC=$( (cd "$API" && php migrate.php --sync-content-sql) \
                 | mysql -u"$DB_USER" -p"$DB_PASS" --default-character-set=utf8mb4 mrszoko 2>&1 ); then
              echo 'contenu éditorial : synchronisé'
            else
              echo 'ATTENTION : synchronisation du contenu échouée'
              printf '%s\n' "$OUT_SC" | head -3 | sed 's/^/    MySQL: /'
            fi
          else
            echo 'ATTENTION : mysql injoignable — rebranding et contenu NON synchronisés'
          fi

          # ── Boutiques belges de démonstration. La maquette en peuplait cinq,
          # avec chiffre d'affaires et taux d'adoption : le décor d'une démo de
          # franchise, alors que l'affaire réelle est UNE boutique à Wrocław.
          # Des chiffres de démonstration qui ressemblent à des vrais sont pires
          # que pas de chiffres — on lit « 29 800 » sur un tableau de bord et on
          # en tire une conclusion.
          #
          # PAR LE CLIENT mysql, ET PAS PAR migrate.php. Le php-cli de ce
          # serveur n'a pas pdo_mysql — l'étape de vérification le mesure et
          # l'écrit à chaque déploiement. `php migrate.php --purge-demo-shops`
          # ne pouvait donc RIEN faire, et le `|| echo` avalait l'échec : le
          # déploiement 79 est passé au vert en laissant les cinq boutiques en
          # place. C'est le contrôle ajouté juste après qui l'a dit. Les deux
          # appels voisins (--rebrand, --sync-content) sont dans le même cas :
          # ils ne tournent pas ici, et ce qui est en base y est arrivé par le
          # premier démarrage de l'application, pas par eux.
          #
          # On ne supprime que les cinq identifiants connus — jamais un
          # TRUNCATE : un second point de vente réel doit survivre au passage.
          # L'audit n'est pas touché : c'est l'histoire, elle reste. Aucun
          # compte n'est supprimé ; seuls les liens vers une boutique absente
          # partent, parce qu'un tel lien est un compte qui ne voit rien.
          # Idempotent : rejoué, il ne trouve plus rien.
          #
          # wsm_kpis part EN ENTIER, et c'est une exception assumée à la règle
          # « jamais un TRUNCATE » : cette table ne contenait que six chaînes
          # de maquette (« Obrót sieci 428 k€ », « Aktywne sklepy 14 / 15 »),
          # elle n'a jamais eu d'écriture applicative, et plus personne ne la
          # lit — les tuiles sont calculées. Il n'y a donc aucune donnée
          # d'exploitation à protéger, contrairement à wsm_shops où un second
          # point de vente réel pourrait exister demain.
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            mysql -u"$DB_USER" -p"$DB_PASS" --default-character-set=utf8mb4 mrszoko <<'SQL' 2>/dev/null \
              && echo 'boutiques de démonstration : retrait joué' \
              || echo 'ATTENTION : le retrait des boutiques de démonstration a échoué'
          DELETE FROM wsm_user_shops WHERE shop_id IN ('bxl','and','ucc','sch','lv');
          UPDATE wsm_users SET portee = 'Cała sieć'
           WHERE portee IN ('Bruxelles-Centre','Anderlecht, Uccle','Louvain','Anderlecht','Uccle','Schaerbeek');
          DELETE FROM wsm_shops WHERE id IN ('bxl','and','ucc','sch','lv');
          DELETE FROM wsm_kpis;
          SQL
          else
            echo 'ATTENTION : mysql injoignable — boutiques de démonstration NON retirées'
          fi

          # ── Compte administrateur ────────────────────────────────────────────
          #
          # CE BLOC N'A JAMAIS RIEN FAIT, ET IL SE DISAIT VERT. Il appelait ici
          # `php migrate.php --set-password` : ce php-là n'a pas pdo_mysql (le
          # contrôle voisin le mesure et l'écrit à chaque passage), donc l'appel
          # levait « could not find driver » avant la première requête. Le `if`
          # rattrapait, on écrivait « WSM_ADMIN_PASSWORD refusé », et la suite se
          # déroulait normalement. Poser le secret, le changer, le refaire : la
          # base ne bougeait pas d'un octet, et rien ne le disait clairement.
          # C'est la panne de `--sync-content`, sur un autre objet.
          #
          # `--set-password-sql` n'ouvre AUCUNE base : password_hash() n'en a pas
          # besoin. Il écrit le SQL, le client mysql — qui, lui, marche ici — le
          # joue. Le mot de passe entre par stdin (jamais dans `ps`, jamais dans
          # un `set -x`) et ne ressort pas : ce qui voyage est un hachage bcrypt.
          EMAIL="${ADM_EMAIL:-admin@misterszoko.com}"
          if [ -z "${ADM_PASS:-}" ]; then
            echo "WSM_ADMIN_PASSWORD absent — aucun compte touché."
            echo "  Pour (re)prendre la main sur la console : poser ce secret et relancer."
          elif [ -z "${DB_USER:-}" ]; then
            echo "  ^ ATTENTION : WSM_ADMIN_PASSWORD posé mais WSM_DB_USER absent —"
            echo "    le mot de passe N'A PAS été changé (aucun accès à la base)."
          elif ! ( umask 077; printf '%s' "$ADM_PASS" \
                     | php "$API/migrate.php" --set-password-sql "$EMAIL" > /tmp/wsm-adm.sql ) 2>/tmp/wsm-adm.err; then
            # Refusé à l'émission (moins de 10 caractères, adresse invalide).
            # Cela ne doit PAS faire tomber le déploiement : le site est par
            # ailleurs sain. On le dit fort, et le compte existant reste intact.
            echo "  ^ ATTENTION : WSM_ADMIN_PASSWORD refusé — $(head -1 /tmp/wsm-adm.err)"
            echo "    Le compte existant n'a PAS été touché (min 10 caractères, e-mail valide)."
          else
            # Le SELECT final du SQL ne rend une ligne QUE si le compte porte
            # bien ce hachage : preuve, et non promesse. Zéro ligne = rien posé.
            OUT=$(mysql -u"$DB_USER" -p"$DB_PASS" --default-character-set=utf8mb4 -N -B mrszoko \
                    < /tmp/wsm-adm.sql 2>/tmp/wsm-adm.err) && RC=0 || RC=1
            if [ "$RC" = 0 ] && [ -n "$OUT" ]; then
              echo "$OUT"
              # Rappel de l'adresse, hors racine web et lisible par root seul.
              # LE MOT DE PASSE N'Y EST PAS : il vit dans le secret GitHub, qui
              # est sa seule source. Un fichier qui le répète est une copie de
              # plus à perdre.
              printf 'Mister Szoko — konsola marki\nURL    : /mrszoko/backoffice\nE-mail : %s\nHasło  : secret GitHub WSM_ADMIN_PASSWORD (posé à chaque déploiement)\n' "$EMAIL" > /root/mrszoko-admin.txt
              chmod 600 /root/mrszoko-admin.txt
            else
              echo "  ^ ATTENTION : mot de passe de la console NON posé"
              head -3 /tmp/wsm-adm.err 2>/dev/null | sed 's/^/    MySQL: /'
            fi
          fi
          rm -f /tmp/wsm-adm.sql /tmp/wsm-adm.err

          # ── HTTPS : on ne l'impose QUE s'il répond réellement. Sinon une
          # redirection rendrait le site inaccessible.
          HTTPS_CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 "https://localhost/mrszoko/landing/" || echo 000)
          if [ "$HTTPS_CODE" = "200" ]; then
            if ! grep -q 'WSM_HTTPS_REDIRECT' "$DIR/.htaccess" 2>/dev/null; then
              {
                echo ''
                echo '# WSM_HTTPS_REDIRECT — ajouté par le déploiement, TLS vérifié au préalable.'
                echo '<IfModule mod_rewrite.c>'
                echo '  RewriteEngine On'
                echo '  RewriteCond %{HTTPS} !=on'
                echo '  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]'
                echo '</IfModule>'
                echo '<IfModule mod_headers.c>'
                echo '  Header always set Strict-Transport-Security "max-age=15768000"'
                echo '</IfModule>'
              } >> "$DIR/.htaccess"
            fi
            # L'API a son propre .htaccess (RewriteBase + routage vers index.php) :
            # les règles du parent ne s'y appliquent pas. On préfixe donc sa
            # redirection — en 308, qui préserve la méthode des POST. Le rsync
            # réécrit ce fichier à chaque déploiement, l'étape le re-préfixe.
            if [ -f "$API/.htaccess" ] && ! grep -q 'WSM_HTTPS_REDIRECT' "$API/.htaccess"; then
              TMP=$(mktemp)
              {
                echo '# WSM_HTTPS_REDIRECT — ajouté par le déploiement, TLS vérifié au préalable.'
                echo '<IfModule mod_rewrite.c>'
                echo '  RewriteEngine On'
                echo '  RewriteCond %{HTTPS} !=on'
                echo '  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]'
                echo '</IfModule>'
                echo ''
                cat "$API/.htaccess"
              } > "$TMP"
              mv "$TMP" "$API/.htaccess"
              chmod 644 "$API/.htaccess"
              echo "redirection HTTPS ajoutée aussi à l'API (308, préserve les POST)"
            fi
            echo "HTTPS opérationnel (200) → redirection http→https + HSTS activées"
          else
            echo "HTTPS ne répond pas (code $HTTPS_CODE) → redirection NON activée (le site resterait inaccessible)."
            echo "Installez un certificat (certbot) puis relancez le déploiement pour l'activer."
          fi
          REMOTE

      - name: Verify web surfaces on the server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' DIR_SHOP='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/shop' bash -s" << 'REMOTE'
          fail=0
          run() { URL="$1"; MIN="${2:-1}"
            out=$(curl -skL -o /dev/null -w "%{http_code}|%{size_download}|%{content_type}" "$URL")
            IFS='|' read -r code size type <<< "$out"
            size="${size%.*}"
            echo "  $code  $type  ${size}b  $URL"
            if [ "$code" != "200" ] || [ "${size:-0}" -lt "$MIN" ]; then
              echo "  ^ NOT OK — corps de la réponse :"
              curl -skL "$URL" | head -c 300; echo
              fail=1
            fi
          }
          BO="http://localhost/mrszoko/backoffice"
          LP="http://localhost/mrszoko/landing"
          DS="_ds/mister-szoko"
          echo "== backoffice =="
          # La console de franchise exportée n'est plus déployée : plus de
          # support.js, bo_server.js, menu_*.js ni vendor/react*. Ne restent
          # que la porte et ce dont les écrans PHP se servent.
          for f in / /login.php "/$DS/global.css" "/$DS/brand.css" "/$DS/_ds_bundle.js" \
                   /img/logo.png; do
            run "$BO$f" 1
          done

          # Une seule source de polices : tokens/fonts.css. global.css déclarait
          # douze @font-face pointant sur des fichiers absents — des consignes
          # mortes que le prochain lecteur aurait suivies. Elles ne doivent pas
          # revenir par une resynchro de l'export de design.
          # On cherche « @font-face » et non un nom de famille : le commentaire
          # qui explique le retrait cite forcément les familles retirées, et un
          # contrôle qui se déclenche sur sa propre documentation ne vaut rien.
          if curl -skL "$BO/$DS/global.css" | grep -q "@font-face"; then
            echo "  ^ ATTENTION : global.css redéclare des polices — source unique rompue"; fail=1
          else
            echo "  global.css ne déclare aucune police : source unique respectée"
          fi
          echo "== landing : fusionnée dans la boutique, ne doit plus que rediriger =="
          run "$LP/" 100
          LP_HTML=$(curl -skL "$LP/")
          if printf '%s' "$LP_HTML" | grep -q 'url=../shop/'; then
            echo "  /landing/ renvoie vers la boutique : confirmé"
          else
            echo "  ^ NOT OK : /landing/ ne redirige pas vers /shop/"; fail=1
          fi
          # content_seed.json reste servi : c'est la source du seed de wsm_landing_i18n.
          run "$LP/content_seed.json" 4000
          echo "== API landing : contenu servi en 3 langues depuis la base =="
          for lg in pl uk en; do run "$BO/api/landing/content?lang=$lg" 2000; done

          echo "== boutique : pages rendues par le serveur =="
          SH="http://localhost/mrszoko/shop"
          run "$SH/" 6000
          run "$SH/koszyk" 3000
          run "$SH/kasa" 3000
          run "$SH/shop.css" 5000
          run "$SH/tokens.css" 2000
          # Les polices sont servies par NOUS. Une page qui les redemanderait à
          # Google resterait blanche derrière un pare-feu d'entreprise ou un
          # bloqueur — quatorze secondes mesurées quand la connexion est
          # refusée. On vérifie donc les deux faces : plus aucune référence
          # sortante dans la feuille, et un fichier réellement servi ici.
          if curl -skL "$SH/tokens.css" | grep -q "@import url(.https://fonts"; then
            echo "  ^ NOT OK : tokens.css réclame encore les polices à Google"; fail=1
          else
            echo "  polices : aucune dépendance sortante dans tokens.css"
          fi
          NF2=$(curl -skL "$SH/tokens.css" | grep -c "@font-face" || echo 0)
          echo "  polices : $NF2 déclarations @font-face"
          if [ "${NF2:-0}" -lt 10 ]; then echo "  ^ NOT OK : les @font-face locales manquent"; fail=1; fi
          run "$SH/fonts/mulish-normal-300_800-latin.woff2" 20000
          run "$SH/shop.js" 1000
          # Le fil d'Ariane est aussi ce que Google affiche sous le titre : s'il
          # disparaît, on le voit ici plutôt que dans les résultats de recherche.
          SLUG0=$(curl -skL "$SH/" | grep -o 'href="[^"]*/shop/p/[^"]*"' | head -1 | sed 's/.*\/p\///;s/"$//')
          if [ -n "$SLUG0" ]; then
            curl -skL "$SH/p/$SLUG0" | grep -q 'BreadcrumbList' \
              && echo "  fil d'Ariane balisé sur la fiche produit : confirmé" \
              || { echo "  ^ NOT OK : plus de fil d'Ariane sur la fiche produit"; fail=1; }
          fi
          # Une boutique « rapide » se prouve ici : le catalogue doit être DANS
          # la première réponse HTML, pas récupéré ensuite par du JavaScript.
          HOME_HTML=$(curl -skL "$SH/")
          N_PROD=$(printf '%s' "$HOME_HTML" | grep -c 'class="card"' || true)
          N_PRICE=$(printf '%s' "$HOME_HTML" | grep -o 'class="price"' | wc -l)
          echo "  produits rendus côté serveur : $N_PROD  ·  prix rendus : $N_PRICE"
          [ "${N_PROD:-0}" -ge 5 ] || { echo "  ^ NOT OK : le catalogue n'est pas dans le HTML initial"; fail=1; }
          [ "${N_PRICE:-0}" -ge 5 ] || { echo "  ^ NOT OK : les prix ne sont pas dans le HTML initial"; fail=1; }
          # Page unique : le contenu éditorial de la landing doit y être, rendu
          # par le serveur comme le reste — sinon la fusion n'a pas eu lieu.
          for anchor in 'id="katalog"' 'id="pro"' 'hero-strip'; do
            if printf '%s' "$HOME_HTML" | grep -q "$anchor"; then
              echo "  section $anchor : présente"
            else
              echo "  ^ NOT OK : section $anchor absente de la page unique"; fail=1
            fi
          done
          # Fiche produit : on suit un vrai lien du catalogue.
          SLUG=$(printf '%s' "$HOME_HTML" | grep -o 'href="[^"]*/shop/p/[^"]*"' | head -1 | sed 's/.*\/p\///;s/"$//')
          if [ -n "$SLUG" ]; then run "$SH/p/$SLUG" 4000; else echo "  ^ NOT OK : aucun lien produit"; fail=1; fi
          # La source du contenu ne doit pas être servie au public.
          c=$(curl -skL -o /dev/null -w '%{http_code}' "$SH/content_seed.json")
          echo "  $c  GET /shop/content_seed.json  (attendu 403/404)"
          case "$c" in 403|404) ;; *) echo "  ^ FUITE : la source du contenu est publique"; fail=1;; esac

          echo "== console : écrans PHP autonomes (session exigée) =="
          # On ne peut pas lire le code de statut brut : la redirection HTTPS du
          # .htaccess répond 301 AVANT que PHP soit atteint, et on prendrait ce
          # 301 pour la réponse de l'écran. On suit donc les redirections et on
          # regarde OÙ l'on atterrit : sans session, jamais sur la page elle-même.
          for pg in pulpit.php zamowienia.php faktury.php produkty.php magazyn.php tresci.php kontrahenci.php kraje.php rabaty.php poczta.php uzytkownicy.php audyt.php ustawienia.php etykieta_inpost.php superadmin.php klienci.php; do
            eff=$(curl -skL -o /dev/null -w '%{url_effective}' "$BO/$pg")
            echo "  GET /backoffice/$pg  →  $eff"
            case "$eff" in
              *"$pg"*) echo "  ^ FUITE : écran servi sans authentification"; fail=1;;
              *) ;;
            esac
          done
          # Le châssis commun et le lanceur : sans eux, les écrans s'affichent nus
          # et la console n'offre aucun chemin vers eux.
          run "$BO/console.css" 4000
          # La colonne de navigation est le seul chemin vers les écrans : si la
          # feuille perdait la règle, on se retrouverait avec un tiroir ouvert
          # en permanence par-dessus le contenu.
          curl -skL "$BO/console.css" | grep -q 'grid-template-columns: 268px' \
            && echo "  colonne de navigation à gauche : présente dans la feuille" \
            || { echo "  ^ NOT OK : la mise en page à deux colonnes a disparu"; fail=1; }
          # Le bloc marque et l'en-tête de page partagent leur hauteur : sans
          # cette variable, le bandeau du haut se lit comme deux morceaux.
          curl -skL "$BO/console.css" | grep -q -- '--wsm-bar-h' \
            && echo "  bandeau supérieur d'une seule hauteur : confirmé" \
            || { echo "  ^ NOT OK : le bandeau du haut va se désaligner"; fail=1; }
          # console-nav.js injectait la navigation des écrans PHP dans la
          # console exportée. Celle-ci n'existe plus : le rail est rendu par
          # console.php, sur chaque écran, par le serveur.

          # Le dossier des photos doit être inscriptible par le serveur web,
          # sinon l'envoi échoue au moment où le client en a besoin.
          if sudo -n -u www-data test -w "$DIR_SHOP/media" 2>/dev/null || [ -w "$DIR_SHOP/media" ]; then
            echo "  shop/media inscriptible : oui"
          else
            echo "  ^ ATTENTION : shop/media non inscriptible — l'envoi de photos échouera"; fail=1
          fi
          # Une image reste une image : le dossier ne doit pas exécuter de script.
          printf '%s' '<?php echo "EXECUTED"; ?>' > "$DIR_SHOP/media/_probe.php" 2>/dev/null || true
          if [ -f "$DIR_SHOP/media/_probe.php" ]; then
            OUT=$(curl -sk "http://localhost/mrszoko/shop/media/_probe.php" | head -c 40)
            rm -f "$DIR_SHOP/media/_probe.php"
            case "$OUT" in
              *EXECUTED*) echo "  ^ FUITE : PHP s'exécute dans shop/media"; fail=1;;
              *) echo "  shop/media n'exécute pas PHP : confirmé";;
            esac
          fi

          echo "== API boutique : catalogue public, écriture protégée =="
          for lg in pl uk en; do run "$BO/api/shop/catalog?lang=$lg" 3000; done
          # Le serveur doit ignorer un prix envoyé par le client.
          PID=$(curl -skL "$BO/api/shop/catalog" | sed 's/.*"products":\[{"id":"\([^"]*\)".*/\1/')
          REF=$(curl -skL "$BO/api/shop/catalog" | sed 's/.*"products":\[{[^}]*"price":\([0-9]*\).*/\1/')
          GOT=$(curl -skL -X POST "$BO/api/shop/quote" -H 'Content-Type: application/json' \
                 -d "{\"items\":[{\"id\":\"$PID\",\"qty\":1,\"price\":1}]}" \
                 | sed 's/.*"items_gross":\([0-9]*\).*/\1/')
          echo "  prix catalogue $REF gr · prix imposé par le client 1 gr · facturé $GOT gr"
          [ "$GOT" = "$REF" ] || { echo "  ^ NOT OK : le client a pu influencer le montant"; fail=1; }
          # Notification de paiement : fermée tant que tpay n'est pas configuré.
          c=$(curl -skL -o /dev/null -w '%{http_code}' -X POST "$BO/api/shop/tpay/notify" \
               -d 'tr_id=X&tr_status=TRUE&md5sum=00000000000000000000000000000000')
          echo "  $c  POST /shop/tpay/notify  (non signée — attendu 400/503, jamais 200)"
          case "$c" in 400|503) ;; *) echo "  ^ NOT OK : une notification non signée est acceptée"; fail=1;; esac
          echo "== authentification (preuve de cloisonnement) =="
          API="$BO/api"
          TOK=$(php -r '$c=@include "'"$DIR_API"'/config.local.php"; echo is_array($c)?($c["admin_token"]??""):"";' 2>/dev/null || echo "")
          codeOf() { curl -skL -o /dev/null -w '%{http_code}' "$@"; }
          for r in kpis users audit delivery-clients orders shop-kpis shop-config; do
            c=$(codeOf "$API/franchisor/$r")
            echo "  $c  GET /franchisor/$r  (sans identité — attendu 401)"
            [ "$c" = "401" ] || { echo "  ^ FUITE : lecture accessible sans authentification"; fail=1; }
          done
          c=$(codeOf "$API/auth/me"); echo "  $c  GET /auth/me  (sans identité — attendu 401)"
          [ "$c" = "401" ] || { echo "  ^ NOT OK"; fail=1; }
          c=$(codeOf -H "X-Admin-Token: wrong-token" "$API/franchisor/kpis")
          echo "  $c  GET /franchisor/kpis  (jeton faux — attendu 401)"
          [ "$c" = "401" ] || { echo "  ^ NOT OK"; fail=1; }
          if [ -n "$TOK" ]; then
            c=$(codeOf -H "X-Admin-Token: $TOK" "$API/franchisor/kpis")
            echo "  $c  GET /franchisor/kpis  (jeton de service — attendu 200)"
            [ "$c" = "200" ] || { echo "  ^ NOT OK : l'API ne répond pas au jeton configuré"; fail=1; }
          else
            echo "  (jeton de service illisible depuis ce compte — contrôle authentifié sauté)"
          fi
          echo "== VIES : contrôle réel des numéros de TVA depuis le serveur =="
          # VIES tombe régulièrement — c'est justement pourquoi l'intégration
          # distingue « inconnu » de « indisponible ». On observe donc, sans
          # faire échouer le déploiement sur une panne de la Commission.
          # On vise https:// DIRECTEMENT. En http, le .htaccess répond 308 vers
          # https et c'est cette page de redirection qu'on lirait — l'erreur a
          # déjà été faite une fois sur les écrans de console.
          BOS="https://localhost/mrszoko/backoffice"
          VSTAT=$(curl -sk -o /dev/null -w '%{http_code}' "$BOS/api/franchisor/vies" -X POST \
                   -H 'Content-Type: application/json' -d '{"vat_eu":"PL5252248481"}')
          echo "  $VSTAT  POST /franchisor/vies  (sans identité — attendu 401)"
          [ "$VSTAT" = "401" ] || { echo "  ^ FUITE : vérification VIES ouverte à tous"; fail=1; }
          if [ -n "$TOK" ]; then
            VJSON=$(curl -sk -X POST "$BOS/api/franchisor/vies" -H "X-Admin-Token: $TOK" \
                     -H 'Content-Type: application/json' -d '{"vat_eu":"PL5252248481","force":true}')
            VS=$(printf '%s' "$VJSON" | sed 's/.*"status":"\([a-z]*\)".*/\1/')
            echo "  VIES depuis ce serveur : $VS"
            case "$VS" in
              valid)       echo "  → la Commission répond, les numéros sont réellement vérifiés";;
              unavailable) echo "  → VIES injoignable pour l'instant : les saisies passent et restent à revérifier";;
              invalid)     echo "  → réponse « inconnu » sur un numéro de test : à regarder";;
              *)           echo "  ^ NOT OK : réponse VIES illisible"; fail=1;;
            esac
          fi

          echo "== racine /mrszoko → redirection boutique =="
          run "http://localhost/mrszoko/" 50
          curl -skL "http://localhost/mrszoko/" | grep -q 'url=shop/' \
            && echo "  la racine renvoie vers la boutique : confirmé" \
            || { echo "  ^ NOT OK : la racine ne renvoie pas vers /shop/"; fail=1; }
          if [ "$fail" = "0" ]; then echo "ALL WEB CHECKS OK"; else echo "WEB CHECK FAILED"; exit 1; fi
          REMOTE

      # Deuxième session SSH, et non la suite de la première : GitHub limite
      # une expression de workflow à 21 000 caractères, et la vérification
      # d'un seul tenant venait de passer ce seuil. Le run était alors tué
      # avant le premier job, sans log, sur toutes les branches — un échec
      # qui ne ressemble pas du tout à sa cause. Deux étapes valent mieux
      # qu'une vérification qu'on raboterait pour tenir dans la limite.
      - name: Verify database on the server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' DIR_SHOP='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/shop' bash -s" << 'REMOTE'
          fail=0
          # Le PHP en LIGNE DE COMMANDE de ce serveur n'a pas forcément les
          # mêmes extensions que celui qui sert les pages : php-cli et php-fpm
          # chargent des .ini différents, et pdo_mysql manque souvent au
          # premier. Trois déploiements ont échoué sur « could not find
          # driver » avant qu'on le constate. On le mesure une fois, et les
          # contrôles qui ont besoin de la base passent par le client mysql —
          # qui, lui, marche. Un contrôle impossible ici n'est pas un défaut
          # du produit, et ne doit pas se lire comme tel.
          PHPPDO=$(php -r 'echo in_array("mysql", PDO::getAvailableDrivers(), true) ? "1" : "0";' 2>/dev/null || echo 0)
          [ "$PHPPDO" = "1" ] \
            && echo "  php-cli parle à MySQL : oui" \
            || echo "  php-cli SANS pdo_mysql — kontrole bazy idą przez klienta mysql (nie jest to usterka aplikacji)"

          # RÉVEIL. Certaines tables ne naissent qu'au premier démarrage de
          # l'application (wsm_ensure_nouvelles_tables). Interroger la base
          # avant que quiconque ait ouvert une page ferait échouer des
          # contrôles parfaitement sains — c'est arrivé au déploiement 61.
          curl -sk -o /dev/null --max-time 15 "http://localhost/mrszoko/shop/" || true
          echo "== moteur de données (preuve MySQL) =="
          Q="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name LIKE 'wsm_%'"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            N=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$Q" 2>/dev/null || echo 0)
          elif command -v mysql >/dev/null && mysql -e 'SELECT 1' >/dev/null 2>&1; then
            N=$(mysql -N -e "$Q" 2>/dev/null || echo 0)
          else
            N=""
          fi
          if [ -n "$N" ]; then
            echo "  tables wsm_ dans MySQL mrszoko : $N"
            # Les colonnes tpay/InPost sont ajoutées par wsm_ensure_commerce_columns()
            # au premier accès. On vérifie qu'elles existent VRAIMENT sous MySQL :
            # une migration silencieusement ratée ferait perdre les saisies.
            QC="SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='mrszoko' AND ((table_name='wsm_clients' AND column_name IN ('client_type','email','phone','nip','vat_eu','bill_postcode')) OR (table_name='wsm_client_points' AND column_name IN ('delivery_method','inpost_point','postcode')) OR (table_name='wsm_products' AND column_name IN ('sku','ean','vat_rate','weight_g','parcel_template')))"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NC=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QC" 2>/dev/null || echo 0)
            else
              NC=$(mysql -N -e "$QC" 2>/dev/null || echo 0)
            fi
            echo "  colonnes tpay/InPost migrées : $NC / 14"
            if [ "${NC:-0}" -lt 14 ]; then echo "  ^ ATTENTION : migration incomplète — les formulaires perdraient des données"; fail=1; fi
            # Les tables de la boutique sont créées par wsm_ensure_shop() au
            # premier accès. Sans elles, une commande n'a nulle part où aller.
            QO="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name IN ('wsm_orders','wsm_order_items','wsm_payments','wsm_payment_events','wsm_shipments','wsm_order_events','wsm_shipping_methods','wsm_shop_i18n')"
            # L'index UNIQUE sur event_key EST le garde-fou anti-double-encaissement :
            # sans lui, une notification tpay rejouée facturerait deux fois.
            QU="SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='mrszoko' AND table_name='wsm_payment_events' AND column_name='event_key' AND non_unique=0"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NO=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QO" 2>/dev/null || echo 0)
              NU=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QU" 2>/dev/null || echo 0)
            else
              NO=$(mysql -N -e "$QO" 2>/dev/null || echo 0)
              NU=$(mysql -N -e "$QU" 2>/dev/null || echo 0)
            fi
            QK="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name='wsm_countries'"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NK=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QK" 2>/dev/null || echo 0)
              NKA=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "SELECT COUNT(*) FROM mrszoko.wsm_countries WHERE active=1" 2>/dev/null || echo 0)
            else
              NK=$(mysql -N -e "$QK" 2>/dev/null || echo 0)
              NKA=$(mysql -N -e "SELECT COUNT(*) FROM mrszoko.wsm_countries WHERE active=1" 2>/dev/null || echo 0)
            fi
            echo "  table des pays présente : $NK/1 · pays ouverts à la vente : $NKA"
            if [ "${NK:-0}" -lt 1 ]; then echo "  ^ ATTENTION : la liste des pays n'existe pas"; fail=1; fi
            if [ "${NKA:-0}" -lt 1 ]; then echo "  ^ ATTENTION : aucun pays ouvert — la caisse serait bloquée"; fail=1; fi
            # Messagerie : sans ces tables, la promesse « on vous recontacte »
            # faite à une commande hors stock n'a nulle part où s'écrire.
            QM="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name IN ('wsm_mail_templates','wsm_messages','wsm_settings')"
            QMU="SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='mrszoko' AND table_name='wsm_messages' AND column_name='event_key' AND non_unique=0"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NM=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QM" 2>/dev/null || echo 0)
              NMU=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QMU" 2>/dev/null || echo 0)
              NMT=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "SELECT COUNT(*) FROM mrszoko.wsm_mail_templates WHERE active=1" 2>/dev/null || echo 0)
              NMA=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "SELECT COUNT(*) FROM mrszoko.wsm_mail_templates WHERE event<>'' AND active=1" 2>/dev/null || echo 0)
            else
              NM=$(mysql -N -e "$QM" 2>/dev/null || echo 0)
              NMU=$(mysql -N -e "$QMU" 2>/dev/null || echo 0)
              NMT=$(mysql -N -e "SELECT COUNT(*) FROM mrszoko.wsm_mail_templates WHERE active=1" 2>/dev/null || echo 0)
              NMA=$(mysql -N -e "SELECT COUNT(*) FROM mrszoko.wsm_mail_templates WHERE event<>'' AND active=1" 2>/dev/null || echo 0)
            fi
            # Facturation : les deux index UNIQUE SONT la numérotation. Sans eux,
            # deux factures pourraient porter le même numéro — ce qu'un contrôle
            # fiscal relève immédiatement.
            QF="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name IN ('wsm_invoices','wsm_invoice_items')"
            QFU="SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='mrszoko' AND table_name='wsm_invoices' AND non_unique=0 AND index_name <> 'PRIMARY'"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NF=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QF" 2>/dev/null || echo 0)
              NFU=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QFU" 2>/dev/null || echo 0)
            else
              NF=$(mysql -N -e "$QF" 2>/dev/null || echo 0)
              NFU=$(mysql -N -e "$QFU" 2>/dev/null || echo 0)
            fi
            # CMS : les deux tables de contenu SONT les deux sites publics. Si
            # elles étaient vides, la boutique et la page d'accueil s'afficheraient
            # sans un mot — et l'écran Treści n'aurait rien à éditer.
            QT="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name IN ('wsm_shop_i18n','wsm_landing_i18n','wsm_landing_products')"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NT=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QT" 2>/dev/null || echo 0)
              NTS=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "SELECT COUNT(*) FROM mrszoko.wsm_shop_i18n" 2>/dev/null || echo 0)
              NTL=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "SELECT COUNT(*) FROM mrszoko.wsm_landing_i18n" 2>/dev/null || echo 0)
              NTG=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "SELECT COUNT(DISTINCT lang) FROM mrszoko.wsm_shop_i18n" 2>/dev/null || echo 0)
            else
              NT=$(mysql -N -e "$QT" 2>/dev/null || echo 0)
              NTS=$(mysql -N -e "SELECT COUNT(*) FROM mrszoko.wsm_shop_i18n" 2>/dev/null || echo 0)
              NTL=$(mysql -N -e "SELECT COUNT(*) FROM mrszoko.wsm_landing_i18n" 2>/dev/null || echo 0)
              NTG=$(mysql -N -e "SELECT COUNT(DISTINCT lang) FROM mrszoko.wsm_shop_i18n" 2>/dev/null || echo 0)
            fi
            # Marques : la table et la colonne qui la relie aux produits. Sans
            # elles l'écran Marki serait muet et les logos absents de la vitrine.
            QB="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name='wsm_brands'"
            QBC="SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='mrszoko' AND table_name='wsm_products' AND column_name='brand_id'"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NB=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QB" 2>/dev/null || echo 0)
              NBC=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QBC" 2>/dev/null || echo 0)
            else
              NB=$(mysql -N -e "$QB" 2>/dev/null || echo 0)
              NBC=$(mysql -N -e "$QBC" 2>/dev/null || echo 0)
            fi
            echo "  marki : tabela $NB/1 · powiązanie z produktem $NBC/1"
            if [ "${NB:-0}" -lt 1 ] || [ "${NBC:-0}" -lt 1 ]; then echo "  ^ ATTENTION : les marques n'ont pas de table ou pas de lien produit"; fail=1; fi
            echo "  CMS (treści) : $NT / 3 tabele · sklep $NTS tekstów · strona $NTL · języki $NTG"
            if [ "${NT:-0}" -lt 3 ]; then echo "  ^ ATTENTION : le contenu des sites publics n'a pas de table"; fail=1; fi
            if [ "${NTS:-0}" -lt 100 ]; then echo "  ^ ATTENTION : la boutique n'a presque aucun texte — page muette"; fail=1; fi
            if [ "${NTL:-0}" -lt 40 ]; then echo "  ^ ATTENTION : la page d'accueil n'a presque aucun texte"; fail=1; fi
            if [ "${NTG:-0}" -lt 3 ]; then echo "  ^ ATTENTION : les trois langues ne sont pas toutes présentes"; fail=1; fi
            QS="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name IN ('wsm_stock_moves','wsm_stock_docs')"
            if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              NS=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QS" 2>/dev/null || echo 0)
            else
              NS=$(mysql -N -e "$QS" 2>/dev/null || echo 0)
            fi
            echo "  magazyn (ruchy + dokumenty) : $NS / 2"
            if [ "${NS:-0}" -lt 2 ]; then echo "  ^ ATTENTION : les mouvements ou les bons de magasin n'ont nulle part où s'écrire"; fail=1; fi
            echo "  tables faktur : $NF / 2 · indeksy UNIQUE numeracji : $NFU / 2"
            if [ "${NF:-0}" -lt 2 ]; then echo "  ^ ATTENTION : pas de quoi écrire une facture"; fail=1; fi
            if [ "${NFU:-0}" -lt 2 ]; then echo "  ^ ATTENTION : sans ces index, deux factures pourraient porter le même numéro"; fail=1; fi
            echo "  tables poczta + ustawienia : $NM / 3 · modèles actifs : $NMT (dont $NMA automatiques)"
            echo "  index UNIQUE anti-doublon (wsm_messages.event_key) : $NMU"
            if [ "${NM:-0}" -lt 3 ]; then echo "  ^ ATTENTION : la messagerie n'a pas de quoi écrire au client"; fail=1; fi
            if [ "${NMU:-0}" -lt 1 ]; then echo "  ^ ATTENTION : sans cet index, un client recevrait deux fois le même message"; fail=1; fi
            if [ "${NMA:-0}" -lt 4 ]; then echo "  ^ ATTENTION : aucune réponse automatique attachée aux événements"; fail=1; fi
            echo "  tables boutique créées : $NO / 8"
            echo "  index UNIQUE anti-double-paiement (wsm_payment_events.event_key) : $NU"
            if [ "${NO:-0}" -lt 8 ]; then echo "  ^ ATTENTION : la boutique n'a pas de quoi enregistrer une commande"; fail=1; fi
            if [ "${NU:-0}" -lt 1 ]; then echo "  ^ ATTENTION : sans cet index, une notification rejouée encaisserait deux fois"; fail=1; fi
            if [ "${N:-0}" -lt 15 ]; then echo "  ^ ATTENTION : l'API ne semble pas servir depuis MySQL mrszoko"; fi
          else
            echo "  mysql injoignable (ni secrets ni socket) — pas de preuve directe"
          fi
          echo "== treści i szablony dosypane po starcie =="
          # Le semis ne tournait que sur base vide : tout ce qui est livré
          # après la mise en route restait sans texte. Ces deux comptes le
          # vérifient sur la base RÉELLE — via le client mysql, parce que le
          # php-cli d'ici n'a pas de pilote (voir la sonde plus haut).
          QK="SELECT CONCAT('etykiety_kontaktu=', (SELECT COUNT(*) FROM mrszoko.wsm_shop_i18n WHERE k LIKE 'contact.%'), ' szablony_potwierdzenia=', (SELECT COUNT(*) FROM mrszoko.wsm_mail_templates WHERE code='formularz'), ' jezyki=', (SELECT COUNT(*) FROM mrszoko.wsm_langs WHERE published=1), ' tlumaczenia_poczty=', (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name='wsm_message_tr'), ' notatki=', (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mrszoko' AND table_name='wsm_client_notes'))"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            KV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QK" 2>&1 || echo "sql-ZLE")
          else
            KV=$(mysql -N -e "$QK" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $KV"
          case "$KV" in
            *"etykiety_kontaktu=0"*) echo "  ^ ATTENTION : formularz kontaktowy bez etykiet"; fail=1;;
          esac
          case "$KV" in
            *"szablony_potwierdzenia=0"*) echo "  ^ ATTENTION : brak szablonu potwierdzenia — gość nie dostanie odpowiedzi"; fail=1;;
          esac
          case "$KV" in
            *"jezyki=0"*) echo "  ^ ATTENTION : żaden język nie jest opublikowany — sklep byłby niemy"; fail=1;;
          esac
          case "$KV" in
            *"tlumaczenia_poczty=0"*) echo "  ^ ATTENTION : brak tabeli tłumaczeń poczty"; fail=1;;
          esac
          case "$KV" in
            *"notatki=0"*) echo "  ^ ATTENTION : brak tabeli notatek o klientach"; fail=1;;
          esac
          case "$KV" in
            *ZLE*|"") echo "  ^ ATTENTION : nie udało się odczytać bazy"; fail=1;;
          esac

          # ── Boutiques de démonstration : parties, et VÉRIFIÉ.
          # Le retrait tourne à l'étape d'amorçage, dans un `(…) || echo` qui
          # avale son propre échec pour ne pas bloquer un déploiement. Une
          # étape verte ne prouve donc PAS que le nettoyage a eu lieu — c'est
          # exactement le genre de vert qu'on croit sur parole et qui n'a rien
          # fait. On mesure le RÉSULTAT en base, là où il compte.
          DEMO=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT COUNT(*) FROM wsm_shops WHERE id IN ('bxl','and','ucc','sch','lv');" 2>/dev/null || echo ZLE)
          case "$DEMO" in
            0)   echo "  boutiques belges de démonstration : aucune (retrait confirmé)" ;;
            ZLE) echo "  ^ ATTENTION : nie udało się sprawdzić wsm_shops"; fail=1 ;;
            *)   echo "  ^ ZLE : $DEMO boutique(s) de démonstration encore en base — le retrait n'a pas tourné"; fail=1 ;;
          esac

          if [ "$fail" = "0" ]; then echo "ALL DB CHECKS OK"; else echo "DB CHECK FAILED"; exit 1; fi
          REMOTE

      - name: Verify bootstrap actually changed the database
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' bash -s" << 'REMOTE'
          fail=0
          # CE QUE L'AMORÇAGE A RÉELLEMENT CHANGÉ EN BASE. Étape à part parce
          # que « Verify database » frôlait les 18 500 caractères et que
          # l'outil de garde disait de scinder — au-delà de 21 000, GitHub
          # rejette le fichier EN SILENCE, ce qui a déjà coûté cinq
          # déploiements. Elle est de toute façon d'une autre nature : les
          # autres contrôles décrivent la FORME de la base (tables, colonnes,
          # index) ; celui-ci vérifie qu'un GESTE a bien eu lieu.
          #
          # Ces deux passages ont tourné DANS LE VIDE pendant des semaines sans
          # que rien ne le dise. On mesure donc le résultat, pas l'exécution.
          RESTE=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT (SELECT COUNT(*) FROM wsm_shops WHERE nom LIKE '%L''Atelier%')
                  + (SELECT COUNT(*) FROM wsm_users WHERE email LIKE '%@latelierby.be%');" 2>/dev/null || echo ZLE)
          case "$RESTE" in
            0)   echo "  libellés L'Atelier restants : aucun (rebranding confirmé)" ;;
            ZLE) echo "  ^ ATTENTION : rebranding non vérifiable"; fail=1 ;;
            *)   echo "  ^ ZLE : $RESTE ligne(s) portent encore L'Atelier — le rebranding n'a pas tourné"; fail=1 ;;
          esac

          # Les tuiles du tableau de bord ne doivent plus venir d'une table :
          # une seule ligne qui survit et c'est « 428 k€ » qui réapparaît en
          # page d'accueil.
          KPI=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT COUNT(*) FROM wsm_kpis;" 2>/dev/null || echo ZLE)
          case "$KPI" in
            0)   echo "  tuiles de maquette : aucune (calculées désormais)" ;;
            ZLE) echo "  ^ ATTENTION : wsm_kpis illisible"; fail=1 ;;
            *)   echo "  ^ ZLE : $KPI tuile(s) de maquette encore en base"; fail=1 ;;
          esac

          # Plus aucun compte ne doit porter l'ancien vocabulaire : un rôle
          # inconnu retombe sur « Podgląd », donc un compte oublié perdrait
          # silencieusement ses droits au lieu de refuser bruyamment.
          VIEUX=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT COUNT(*) FROM wsm_users WHERE role IN ('Centrala','Franczyza');" 2>/dev/null || echo ZLE)
          case "$VIEUX" in
            0)   echo "  rôles : aucun compte en ancien vocabulaire" ;;
            ZLE) echo "  ^ ATTENTION : rôles non vérifiables"; fail=1 ;;
            *)   echo "  ^ ZLE : $VIEUX compte(s) encore en Centrala/Franczyza"; fail=1 ;;
          esac

          # Le contenu livré par les fichiers doit être EN BASE. Le nombre
          # attendu est lu dans les fichiers eux-mêmes (aucune base requise),
          # puis comparé au réel. « Au moins » et pas « exactement » : la
          # console peut légitimement avoir ajouté des libellés à la main.
          for PAIRE in $(cd "$API" && php migrate.php --content-count 2>/dev/null); do
            T="${PAIRE%%=*}"; ATT="${PAIRE##*=}"
            REEL=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e "SELECT COUNT(*) FROM $T;" 2>/dev/null || echo ZLE)
            case "$REEL" in
              ZLE) echo "  ^ ATTENTION : $T illisible"; fail=1 ;;
              *) if [ "${REEL:-0}" -ge "${ATT:-0}" ]; then
                   echo "  $T : $REEL en base pour $ATT livrés"
                 else
                   echo "  ^ ZLE : $T n'a que $REEL lignes pour $ATT livrés — contenu non synchronisé"; fail=1
                 fi ;;
            esac
          done

          # QUELQU'UN PEUT-IL ENTRER DANS LA CONSOLE ? La question n'était posée
          # nulle part, et l'amorçage du compte a échoué en silence pendant des
          # mois (php-cli sans pdo_mysql, échec rattrapé par un `if`). Une
          # console à laquelle personne ne se connecte est une console morte :
          # ce contrôle-là ne prévient pas, il fait tomber.
          ENTREE=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT COUNT(*) FROM wsm_users
              WHERE act = 1 AND password_hash IS NOT NULL AND password_hash <> ''
                AND (locked_until IS NULL OR locked_until < NOW());" 2>/dev/null || echo ZLE)
          case "$ENTREE" in
            0)   echo "  ^ ZLE : AUCUN compte ne peut se connecter à la console"; fail=1 ;;
            ZLE) echo "  ^ ATTENTION : comptes de connexion non vérifiables"; fail=1 ;;
            *)   echo "  connexion : $ENTREE compte(s) peuvent entrer dans la console" ;;
          esac

          if [ "$fail" = "0" ]; then echo "ALL BOOTSTRAP EFFECTS OK"; else echo "BOOTSTRAP EFFECTS FAILED"; exit 1; fi
          REMOTE


      - name: Verify business rules (pure logic, no DB)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' bash -s" << 'REMOTE'
          fail=0
          # Rien ici n'ouvre la base : le php-cli de ce serveur n'a pas de
          # pilote MySQL (voir la sonde de l'étape précédente). Ce sont les
          # RÈGLES qu'on vérifie — celles qui décident ce qui part au client.
          echo "== języki : rejestr i reguły (bez bazy) =="
          # Logika czysta: bez PDO, bo php-cli tego serwera nie ma sterownika.
          # Stan bazy sprawdza blok wyżej, przez klienta mysql.
          LOUT=$(php -r '
            require_once "'"$DIR_API"'/i18n.php";
            require_once "'"$DIR_API"'/translate.php";
            $osiem = count(WSM_LANGS) === 8;
            $baza  = WSM_LANG_BASE === "pl";
            $prog  = WSM_LANG_MIN_COVERAGE >= 50;
            $ph = wsm_tr_placeholders_ok("Koszyk {qty}", "Panier {qty}")
              && !wsm_tr_placeholders_ok("Koszyk {qty}", "Panier {ilosc}");
            $odm = wsm_lang_po("uk") === "po ukraińsku" && wsm_lang_na("de") === "na niemiecki";
            echo ($osiem ? "osiem-ok" : "osiem-ZLE"), " ",
                 ($baza ? "pl-zrodlem-ok" : "pl-zrodlem-ZLE"), " ",
                 ($prog ? "prog-ok" : "prog-ZLE"), " ",
                 ($ph ? "znaczniki-ok" : "znaczniki-ZLE"), " ",
                 ($odm ? "odmiana-ok" : "odmiana-ZLE");
          ' 2>&1); [ $? -eq 0 ] || LOUT="php-ZLE :: $LOUT"
          echo "  $LOUT"
          case "$LOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : warstwa językowa nie działa poprawnie"; fail=1;;
            *) ;;
          esac
          # Les langues servies hier doivent l'être encore. On le VÉRIFIE sur la
          # vitrine, pas sur la table : c'est la page qui compte.
          for L in pl uk en; do
            HTML=$(curl -skL "http://localhost/mrszoko/shop/?lang=$L" | head -c 400)
            case "$HTML" in
              *"lang=\"$L\""*) echo "  sklep w $L : serwowany";;
              *) echo "  ^ ATTENTION : sklep nie serwuje już języka $L"; fail=1;;
            esac
          done
          echo "== tłumaczenie poczty : wykrywanie języka (bez bazy) =="
          MOUT=$(php -r '
            require_once "'"$DIR_API"'/translate.php";
            [$hu] = wsm_tr_detect("Jó napot kívánok, köszönöm a rendelést.");
            [$uk] = wsm_tr_detect("Доброго дня! Дякую за замовлення.");
            [$de] = wsm_tr_detect("Grüße aus Berlin, vielen Dank");
            [$fr] = wsm_tr_detect("Bonjour, je voudrais commander du chocolat noir.");
            echo ($hu === "hu" ? "hu-ok" : "hu-ZLE"), " ",
                 ($uk === "uk" ? "uk-ok" : "uk-ZLE"), " ",
                 ($de === "de" ? "de-ok" : "de-ZLE"), " ",
                 ($fr === "fr" ? "fr-ok" : "fr-ZLE");
          ' 2>&1); [ $? -eq 0 ] || MOUT="php-ZLE :: $MOUT"
          echo "  $MOUT"
          case "$MOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : wykrywanie języka poczty nie działa"; fail=1;;
            *) ;;
          esac
          echo "== CRM : obrót klientów zgadza się z zamówieniami =="
          # Sto czterdziestu kupujących było niewidocznych w konsoli. Ta
          # kontrola pilnuje, żeby suma obrotu z ekranu Klienci nie rozjechała
          # się z zapłaconymi zamówieniami — bo wtedy ktoś liczy inaczej niż
          # Audyt, i dwa ekrany mówią co innego o tych samych pieniądzach.
          QC="SELECT CONCAT('kupujacych=', COUNT(DISTINCT LOWER(email)), ' obrot=', COALESCE(SUM(total_gross),0)) FROM mrszoko.wsm_orders WHERE status <> 'anulowane' AND payment_status = 'oplacone' AND email <> ''"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            CV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QC" 2>&1 || echo "sql-ZLE")
          else
            CV=$(mysql -N -e "$QC" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $CV"
          case "$CV" in
            *ZLE*) echo "  ^ ATTENTION : nie udało się policzyć kupujących"; fail=1;;
          esac
          # Reguły plakietek: logika czysta, bez bazy.
          BOUT=$(php -r '
            require_once "'"$DIR_API"'/crm.php";
            $stary = ["orders"=>4,"paid_orders"=>3,"revenue"=>50000,"unpaid"=>1,
                      "nip"=>"","last_at"=>date("Y-m-d H:i:s")];
            $b = wsm_crm_badges($stary, 10000);
            $nigdy = ["orders"=>2,"paid_orders"=>0,"revenue"=>0,"unpaid"=>2,
                      "nip"=>"","last_at"=>date("Y-m-d H:i:s", time()-400*86400)];
            $bn = wsm_crm_badges($nigdy, 10000);
            // Une alerte doit nommer une personne ET dire quoi faire. Sans le
            // nom elle oblige à chercher ; sans le geste elle culpabilise.
            // (AUCUNE apostrophe dans ce bloc : il vit dans une chaîne shell
            //  entre quotes simples, où le backslash ne protège rien et où la
            //  première apostrophe referme la commande. tools/check-workflow.sh
            //  passe désormais chaque script distant à bash -n.)
            $al = [["type"=>"decroche","severite"=>3,"nom"=>"X","geste"=>"Y","href"=>"klienci.php?email=x"]];
            $forme = ($al[0]["nom"] ?? "") !== "" && ($al[0]["geste"] ?? "") !== ""
                  && str_contains($al[0]["href"], "klienci.php");
            $conc = wsm_crm_concentration([], 5);
            echo (isset($b["staly"]) ? "staly-ok" : "staly-ZLE"), " ",
                 (isset($b["nieoplacone"]) ? "nieoplacone-ok" : "nieoplacone-ZLE"), " ",
                 (isset($bn["nowy"]) && !isset($bn["spiacy"]) ? "nigdy-ok" : "nigdy-ZLE"), " ",
                 (isset($b["vip"]) && !str_contains($b["vip"], "%") ? "plakietka-bez-procentu-ok" : "plakietka-ZLE"), " ",
                 ($forme ? "alert-forma-ok" : "alert-forma-ZLE"), " ",
                 ($conc["part"] === 0.0 ? "koncentracja-pusta-ok" : "koncentracja-ZLE");
          ' 2>&1); [ $? -eq 0 ] || BOUT="php-ZLE :: $BOUT"
          echo "  $BOUT"
          case "$BOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguły plakietek nie działają"; fail=1;;
            *) ;;
          esac
          echo "== platforma : brama superadmina i rachunek =="
          # La porte AVANT l'arithmétique : ce module chiffre ce que la boutique
          # doit à son propriétaire. Sans liste configurée il doit être FERMÉ, et
          # un compte Centrala ne doit jamais l'ouvrir — sinon le locataire lit,
          # et pourrait réécrire, sa propre facture.
          POUT=$(php -r '
            putenv("WSM_SUPERADMIN_EMAILS=");
            require_once "'"$DIR_API"'/platform.php";
            $ferme = !wsm_platform_enabled()
                  && !wsm_is_superadmin(["email"=>"ktos@example.com","role"=>"Centrala"]);
            wsm_config_overlay(["superadmin_emails"=>"wl@example.com"]);
            $ouvert = wsm_is_superadmin(["email"=>"wl@example.com"]);
            $centrala = wsm_is_superadmin(["email"=>"szef@example.com","role"=>"Centrala"]);
            $jeton = wsm_is_superadmin(["email"=>"wl@example.com","service"=>true]);
            $c = wsm_platform_compute("2026-01",
                   ["gross"=>100000,"goods_gross"=>90000,"shipping_gross"=>10000,"orders"=>1],
                   ["rent_net"=>20000,"rate"=>0.15,"basis"=>"brutto","vat_rate"=>0.23]);
            echo ($ferme ? "zamkn-ok" : "zamkn-ZLE"), " ",
                 ($ouvert ? "wlasc-ok" : "wlasc-ZLE"), " ",
                 (!$centrala && !$jeton ? "izolacja-ok" : "izolacja-ZLE"), " ",
                 ($c["commission_net"] === 15000 && $c["total_net"] === 35000 ? "rachunek-ok" : "rachunek-ZLE");
          ' 2>&1); [ $? -eq 0 ] || POUT="php-ZLE :: $POUT"
          echo "  $POUT"
          case "$POUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : la brama superadmina lub rachunek nie działa poprawnie"; fail=1;;
            *) ;;
          esac
          echo "== wycena : la formule tourne sur le serveur, pas seulement ici =="
          # Un chiffre de valorisation part dans un business plan. On vérifie sur
          # la machine qui l'affiche que la fonction existe, que l'objectif vaut
          # bien CA × 15 % × 4,5, et surtout qu'une couverture insuffisante sort
          # MARQUÉE théorique — c'est cette marque qui empêche de présenter un
          # chiffre postulé comme un chiffre mesuré.
          VOUT=$(php -r '
            require_once "'"$DIR_API"'/analytics.php";
            $t = wsm_valuation([["revenue_costed"=>10000]], ["revenue"=>100000,"result"=>9000]);
            $m = wsm_valuation([["revenue_costed"=>80000]], ["revenue"=>100000,"result"=>16000]);
            echo ($t["target_value"] === (int) round(100000*0.15*4.5) ? "cel-ok" : "cel-ZLE"), " ",
                 ($t["theoretical"] === true ? "teor-ok" : "teor-ZLE"), " ",
                 ($m["theoretical"] === false && abs($m["actual_rate"]-0.20) < 1e-9 ? "real-ok" : "real-ZLE");
          ' 2>&1); [ $? -eq 0 ] || VOUT="php-ZLE :: $VOUT"
          echo "  $VOUT"
          case "$VOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : la valorisation ne se calcule pas juste sur le serveur"; fail=1;;
            *) ;;
          esac
          echo "== prog darmowej dostawy : liczba, ktora trafia do sklepu =="
          # Ce seuil s'affiche au client et decide de qui paie le port. Trois
          # facons de le rater, aucune visible a l'oeil : arrondir vers le bas
          # (on offre le port un grosz avant de l'avoir gagne, sur chaque
          # commande), confondre net et brut (la caisse compare du BRUT, donc
          # on offre 23 % trop tot), et calculer sur une marge inconnue.
          FOUT=$(php -r '
            require_once "'"$DIR_API"'/analytics.php";
            $a = wsm_franco_seuil(1000, 0.25, 0.0, 0.23);
            $b = wsm_franco_seuil(1000, 0.30, 0.0, 0.23);
            $c = wsm_franco_seuil(1000, 0.0,  0.0, 0.23);
            echo ($a["net"] === 4000 && $a["brut"] === 4920 ? "rachunek-ok" : "rachunek-ZLE"), " ",
                 ($b["net"] === 3334 ? "zaokraglenie-ok" : "zaokraglenie-ZLE"), " ",
                 ($a["brut"] > $a["net"] ? "brutto-ok" : "brutto-ZLE"), " ",
                 (!$c["possible"] && trim($c["raison"]) !== "" ? "odmowa-ok" : "odmowa-ZLE");
          ' 2>&1); [ $? -eq 0 ] || FOUT="php-ZLE :: $FOUT"
          echo "  $FOUT"
          case "$FOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : prog darmowej dostawy liczy sie zle na serwerze"; fail=1;;
            *) ;;
          esac
          if [ "$fail" = "0" ]; then echo "ALL RULE CHECKS OK"; else echo "RULE CHECK FAILED"; exit 1; fi
          REMOTE

      # ----------------------------------------------------------------------
      #  Les règles qui touchent à L'ARGENT, dans une étape à part.
      #
      #  Pas par goût du rangement : GitHub REFUSE un fichier de workflow dont
      #  une expression dépasse 21 000 caractères, et le refus est SILENCIEUX —
      #  la course est créée puis tuée, zéro job, conclusion « failure », aucun
      #  message nulle part. C'est arrivé une fois sur ce dépôt et le
      #  diagnostic a coûté plus cher que la correction.
      #
      #  tools/check-workflow.sh mesure chaque étape et refuse de laisser
      #  passer. Ce découpage vient de son avertissement, pas d'un incident.
      # ----------------------------------------------------------------------
      - name: Verify money rules (B2B, vouchers, subscriptions)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' bash -s" << 'REMOTE'
          fail=0
          echo "== konta firmowe : rabaty się NIE kumulują =="
          # Le palier au poids et la remise pro répondent à la même question.
          # Les cumuler donne 32 % — toute la marge. On vérifie sur le serveur
          # que le fichier livré applique bien LA MEILLEURE DES DEUX, et qu'il
          # lit l'adresse du client : sans elle, le prix affiché au devis n'est
          # pas celui facturé à la caisse, et le panier est abandonné.
          B2OUT=$(php -r '
            require_once "'"$DIR_API"'/b2b.php";
            $prog = WSM_B2B_KG === 100 && WSM_B2B_MOIS === 3 && WSM_B2B_SEG === "B2B";
            $gr = wsm_b2b_grosze("400,00") === 40000 && wsm_b2b_grosze("400") === 40000;
            $src = (string) @file_get_contents("'"$DIR_API"'/shop.php");
            $max = str_contains($src, "\$b2b[\x27remise\x27] > \$discountPct")
                && !str_contains($src, "\$discountPct += ");
            $mail = str_contains($src, "\$opts[\x27email\x27]");
            $karta = "n/d";
            if (in_array("sqlite", PDO::getAvailableDrivers(), true)) {
              $p = new PDO("sqlite::memory:", null, null,
                    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                     PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC]);
              $p->exec("CREATE TABLE wsm_clients (id INTEGER PRIMARY KEY, email TEXT, seg TEXT, remise TEXT, franco TEXT)");
              $p->exec("INSERT INTO wsm_clients (email,seg,remise,franco) VALUES
                          (\x27absurd@x.pl\x27,\x27\x27,\x2790\x27,\x270\x27),
                          (\x27rabat@x.pl\x27,\x27\x27,\x2710\x27,\x270\x27),
                          (\x27firma@x.pl\x27,\x27B2B\x27,\x2712\x27,\x27400,00\x27)");
              $a = wsm_b2b_conditions($p, "absurd@x.pl");
              $r = wsm_b2b_conditions($p, "rabat@x.pl");
              $f = wsm_b2b_conditions($p, "firma@x.pl");
              $karta = ($a["remise"] === 0.0 && $r["remise"] === 10.0 && !$r["b2b"]
                     && $f["b2b"] && $f["remise"] === 12.0 && $f["franco"] === 40000)
                     ? "ok" : "ZLE";
            }
            echo ($prog ? "progi-ok" : "progi-ZLE"), " ",
                 ($gr ? "grosze-ok" : "grosze-ZLE"), " ",
                 ($max ? "bez-kumulacji-ok" : "bez-kumulacji-ZLE"), " ",
                 ($mail ? "adres-w-wycenie-ok" : "adres-w-wycenie-ZLE"), " ",
                 "karta-", $karta;
          ' 2>&1); [ $? -eq 0 ] || B2OUT="php-ZLE :: $B2OUT"
          echo "  $B2OUT"
          case "$B2OUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguły konta firmowego nie działają"; fail=1;;
            *) ;;
          esac
          # Une remise hors bornes en base est une SAISIE FAUTIVE : le code la
          # neutralise, mais elle doit se voir, parce que quelqu'un croit
          # l'avoir accordée.
          QB="SELECT CONCAT('firmowych=', COALESCE(SUM(seg='B2B'),0), ' rabatow=', COALESCE(SUM(remise>0),0), ' poza_zakresem=', COALESCE(SUM(remise<0 OR remise>50),0)) FROM mrszoko.wsm_clients"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            BV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QB" 2>&1 || echo "sql-ZLE")
          else
            BV=$(mysql -N -e "$QB" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $BV"
          case "$BV" in
            *ZLE*) echo "  ^ ATTENTION : nie udało się policzyć kont firmowych"; fail=1;;
            *poza_zakresem=0) ;;
            *) echo "  ^ UWAGA : rabat poza zakresem 0-50 % na karcie klienta — jest ignorowany przez sklep, popraw go ręcznie";;
          esac
          echo "== kody rabatowe : nic nie oddaje pieniędzy =="
          # Un bon de 50 zl sur un panier de 30 zl doit enlever 30, pas 50.
          # Et un code SANS VALEUR doit etre REFUSE : la table portait deja des
          # lignes de demonstration decrites en toutes lettres et vides de
          # valeur exploitable. Acceptees, elles auraient repondu « code
          # applique » en laissant payer le prix plein — pire qu un refus.
          KOUT=$(php -r '
            require_once "'"$DIR_API"'/promo.php";
            $g = wsm_promo_grosze("20,00") === 2000 && wsm_promo_grosze("20 zl") === 2000;
            $l = str_contains(wsm_promo_label(["kind"=>"procent","pct"=>0]), "bez efektu")
              && wsm_promo_label(["kind"=>"wysylka"]) === "Darmowa wysyłka";
            $lignes = [["line_gross"=>3000,"line_net"=>2439,"line_vat"=>561,"vat_rate"=>0.23]];
            $pris = wsm_promo_spread($lignes, 5000);
            $rien = $pris === 3000 && $lignes[0]["line_gross"] === 0;
            $deux = [["line_gross"=>10000,"line_net"=>9524,"line_vat"=>476,"vat_rate"=>0.05],
                     ["line_gross"=>5000,"line_net"=>4065,"line_vat"=>935,"vat_rate"=>0.23]];
            $p2 = wsm_promo_spread($deux, 2000);
            $somme = 0; $coh = true;
            foreach ($deux as $x) {
              $somme += $x["line_gross"];
              if ($x["line_net"] + $x["line_vat"] !== $x["line_gross"]) $coh = false;
            }
            $vat = $p2 === 2000 && $somme === 13000 && $coh;
            $bornes = count(WSM_PROMO_KINDS) === 3 && WSM_PROMO_MAX_PCT <= 50;
            echo ($g ? "grosze-ok" : "grosze-ZLE"), " ",
                 ($l ? "etykieta-ok" : "etykieta-ZLE"), " ",
                 ($rien ? "bez-zwrotu-ok" : "bez-zwrotu-ZLE"), " ",
                 ($vat ? "vat-ok" : "vat-ZLE"), " ",
                 ($bornes ? "granice-ok" : "granice-ZLE");
          ' 2>&1); [ $? -eq 0 ] || KOUT="php-ZLE :: $KOUT"
          echo "  $KOUT"
          case "$KOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguły kodów rabatowych nie działają"; fail=1;;
            *) ;;
          esac
          # Un code actif mais SANS VALEUR est un piege pour le client : il faut
          # le voir en production, la ou les lignes de demonstration dorment.
          QK="SELECT CONCAT('kodow=', COUNT(*), ' czynnych=', COALESCE(SUM(active),0), ' bez_efektu=', COALESCE(SUM(active = 1 AND ((kind = 'procent' AND pct <= 0) OR (kind = 'kwota' AND kwota <= 0))),0)) FROM mrszoko.wsm_vouchers"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            KV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QK" 2>&1 || echo "sql-ZLE")
          else
            KV=$(mysql -N -e "$QK" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $KV"
          case "$KV" in
            *ZLE*) echo "  ^ ATTENTION : nie udało się policzyć kodów"; fail=1;;
            *bez_efektu=0) ;;
            *) echo "  ^ UWAGA : aktywny kod bez wartości — sklep go ODRZUCA, popraw go lub wycofaj w Rabatach";;
          esac
          echo "== subskrypcje : nic nie jest pobierane =="
          # La regle qui protege le plus : ce module ne PRELEVE pas. Aucune
          # carte n est enregistree. Un texte qui promettrait un debit ferait
          # du premier renouvellement un litige — et donnerait raison au
          # client. On le verifie SUR LE MODELE DE COURRIER livre.
          COUT=$(php -r '
            require_once "'"$DIR_API"'/cykl.php";
            $r = count(WSM_CYKL_RYTMY) === 4
              && WSM_CYKL_RYTMY["co_miesiac"]["dni"] === 30
              && wsm_cykl_rytm("cokolwiek")["dni"] === 30;
            $p = WSM_CYKL_MAX_NIEOPLACONYCH === 3;
            echo ($r ? "rytmy-ok" : "rytmy-ZLE"), " ",
                 ($p ? "pauza-ok" : "pauza-ZLE");
          ' 2>&1); [ $? -eq 0 ] || COUT="php-ZLE :: $COUT"
          echo "  $COUT"
          case "$COUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguły subskrypcji nie działają"; fail=1;;
            *) ;;
          esac
          # Le modele est en base : on le lit par le client mysql, comme le
          # reste de l etat. « pobraliśmy » est le mot qui ne doit PAS y etre.
          QS="SELECT CONCAT('subskrypcji=', (SELECT COUNT(*) FROM mrszoko.wsm_subscriptions), ' aktywnych=', (SELECT COUNT(*) FROM mrszoko.wsm_subscriptions WHERE statut='aktywny'), ' wzor_pl=', (SELECT COUNT(*) FROM mrszoko.wsm_mail_templates WHERE code='subskrypcja' AND lang='pl'), ' obiecuje_pobranie=', (SELECT COUNT(*) FROM mrszoko.wsm_mail_templates WHERE code='subskrypcja' AND (body LIKE '%pobraliśmy%' OR body LIKE '%obciążyliśmy%')))"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            SV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QS" 2>&1 || echo "sql-ZLE")
          else
            SV=$(mysql -N -e "$QS" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $SV"
          case "$SV" in
            *ZLE*) echo "  ^ ATTENTION : nie udało się sprawdzić subskrypcji"; fail=1;;
            *wzor_pl=0*) echo "  ^ ATTENTION : brak wzoru listu — subskrypcja byłaby niema"; fail=1;;
            *obiecuje_pobranie=0) ;;
            *) echo "  ^ ATTENTION : wzór listu obiecuje pobranie, a sklep NIE pobiera — popraw go w Poczcie"; fail=1;;
          esac
          echo "== propozycje : etykieta nie klamie =="
          # « Souvent achete ensemble » sous deux produits que personne n a
          # jamais commandes ensemble est un mensonge. La regle se verifie ici
          # SANS BASE : deux sources, deux cles de libelle, jamais la meme.
          UOUT=$(php -r '
            require_once "'"$DIR_API"'/upsell.php";
            $d = wsm_upsell_cle("razem") !== wsm_upsell_cle("kategoria");
            $r = wsm_upsell_cle("razem") === "upsell.together";
            $k = wsm_upsell_cle("kategoria") === "upsell.shelf";
            $b = WSM_UPSELL_MAX === 3 && WSM_UPSELL_MIN_PAR >= 2;
            echo ($d && $r && $k ? "zrodla-ok" : "zrodla-ZLE"), " ",
                 ($b ? "granice-ok" : "granice-ZLE");
          ' 2>&1); [ $? -eq 0 ] || UOUT="php-ZLE :: $UOUT"
          echo "  $UOUT"
          case "$UOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : etykiety propozycji nie rozroznaja zrodel"; fail=1;;
            *) ;;
          esac
          # Les libelles doivent EXISTER en base, sinon la carte sort muette.
          QU="SELECT CONCAT('etykiet=', COUNT(*)) FROM mrszoko.wsm_shop_i18n WHERE k IN ('upsell.title','upsell.together','upsell.shelf')"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            UV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QU" 2>&1 || echo "sql-ZLE")
          else
            UV=$(mysql -N -e "$QU" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $UV"
          case "$UV" in
            *ZLE*) echo "  ^ ATTENTION : nie udalo sie policzyc etykiet"; fail=1;;
            *etykiet=0) echo "  ^ ATTENTION : brak etykiet propozycji — karty bylyby nieme"; fail=1;;
            *) ;;
          esac
          if [ "$fail" = "0" ]; then echo "ALL RULE CHECKS OK"; else echo "RULE CHECK FAILED"; exit 1; fi
          REMOTE

      # ----------------------------------------------------------------------
      #  Ce qui suit la vente : le dossier, le lien, la campagne, le colis.
      #
      #  Étape séparée pour la même raison que la précédente : GitHub REFUSE
      #  EN SILENCE un fichier dont une expression dépasse 21 000 caractères —
      #  course créée puis tuée, zéro job, aucun message. L'étape « money »
      #  atteignait 19 088. Découpage déclenché par l'avertissement de
      #  tools/check-workflow.sh, pas par un incident.
      # ----------------------------------------------------------------------
      - name: Verify fulfilment rules (claims, links, campaigns, shipping)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' bash -s" << 'REMOTE'
          fail=0
          echo "== zgloszenia : milczenie kosztuje towar =="
          # Le droit polonais donne QUATORZE JOURS pour repondre a une
          # reclamation ; passe ce delai sans reponse, elle est reputee
          # ACCEPTEE. C est la seule regle du logiciel ou ne rien faire coute
          # le produit — d ou le compteur, qui doit devenir NEGATIF.
          ZOUT=$(php -r '
            require_once "'"$DIR_API"'/claims.php";
            $d = WSM_CLAIM_ODPOWIEDZ_DNI === 14 && WSM_CLAIM_ZWROT_DNI === 14
              && WSM_CLAIM_REKOJMIA_MIES === 24;
            $vieux = ["created_at" => date("Y-m-d H:i:s", time() - 20*86400),
                      "statut" => "nowa", "type" => "reklamacja",
                      "paid_gross" => 10000, "refund_gross" => 0];
            $h = wsm_claim_hydrate(new PDO("sqlite::memory:"), $vieux);
            $neg = $h["reponse_reste"] < 0 && $h["milczenie_zgoda"] === true;
            $reste = $h["remboursable"] === 10000;
            echo ($d ? "terminy-ok" : "terminy-ZLE"), " ",
                 ($neg ? "licznik-ok" : "licznik-ZLE"), " ",
                 ($reste ? "granica-zwrotu-ok" : "granica-zwrotu-ZLE");
          ' 2>&1); [ $? -eq 0 ] || ZOUT="php-ZLE :: $ZOUT"
          echo "  $ZOUT"
          case "$ZOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguly zgloszen nie dzialaja"; fail=1;;
            *) ;;
          esac
          echo "== linki : adres sklepu, nie konsoli =="
          # Le lien affiche dans la console pointait sur /backoffice/... :
          # copie-colle dans une infolettre, il envoyait les clients sur une
          # page de connexion. On verifie DEPUIS UN CHEMIN DE CONSOLE.
          LOUT2=$(php -r '
            require_once "'"$DIR_API"'/shop.php";
            require_once "'"$DIR_API"'/links.php";
            $_SERVER["HTTP_HOST"] = "example.pl";
            $_SERVER["REQUEST_URI"] = "/mrszoko/backoffice/zgloszenia.php";
            $a = wsm_shop_base_url();
            $_SERVER["REQUEST_URI"] = "/mrszoko/backoffice/api/shop/quote";
            $b = wsm_shop_base_url();
            $bon = $a === $b && str_ends_with($a, "/mrszoko/shop");
            $u = wsm_link_url($a, "abc123");
            $p = str_contains($u, "?l=abc123") && !str_contains($u, "backoffice");
            echo ($bon ? "adres-ok" : "adres-ZLE :: $a"), " ",
                 ($p ? "param-ok" : "param-ZLE");
          ' 2>&1); [ $? -eq 0 ] || LOUT2="php-ZLE :: $LOUT2"
          echo "  $LOUT2"
          case "$LOUT2" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : link do udostepnienia prowadzilby do konsoli"; fail=1;;
            *) ;;
          esac
          echo "== kampanie : nic nie leci prosto do SMTP =="
          # Cent messages pousses d un coup depuis une IP qui n en envoie
          # jamais coutent la reputation du domaine — et avec elle les
          # confirmations de commande, qui n ont rien demande. On verifie que
          # le lien de sortie est ajoute PAR LE CODE, et que le jeton de
          # desabonnement ne vaut que pour son adresse.
          KAOUT=$(php -r '
            require_once "'"$DIR_API"'/campaign.php";
            $c = ["corps" => "Dzien dobry {{imie}}", "sujet" => "x"];
            $b = wsm_camp_body($c, ["email" => "ala@example.pl", "nom" => "Ala"], "https://x.pl/shop");
            $lien = str_contains($b, "stop=") && !str_contains($c["corps"], "stop=");
            $imie = str_contains($b, "Ala") && !str_contains($b, "{{imie}}");
            $t1 = wsm_camp_stop_token("ala@example.pl");
            $sien = wsm_camp_stop_ok("ala@example.pl", $t1);
            $voisin = wsm_camp_stop_ok("bob@example.pl", $t1);
            $seg = count(WSM_CAMP_SEGMENTS) >= 5;
            echo ($lien ? "wypis-ok" : "wypis-ZLE"), " ",
                 ($imie ? "imie-ok" : "imie-ZLE"), " ",
                 ($sien && !$voisin ? "token-ok" : "token-ZLE"), " ",
                 ($seg ? "grupy-ok" : "grupy-ZLE");
          ' 2>&1); [ $? -eq 0 ] || KAOUT="php-ZLE :: $KAOUT"
          echo "  $KAOUT"
          case "$KAOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguly kampanii nie dzialaja"; fail=1;;
            *) ;;
          esac
          # Une campagne dont les messages seraient partis d un coup se verrait
          # ici : on compte ce qui reste EN FILE contre ce qui est deja parti.
          QC2="SELECT CONCAT('kampanii=', (SELECT COUNT(*) FROM mrszoko.wsm_campaigns), ' w_kolejce=', (SELECT COUNT(*) FROM mrszoko.wsm_messages WHERE template_code='kampania' AND status='kolejka'), ' rezygnacji=', (SELECT COUNT(*) FROM mrszoko.wsm_clients WHERE no_mailing=1))"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            CV2=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QC2" 2>&1 || echo "sql-ZLE")
          else
            CV2=$(mysql -N -e "$QC2" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $CV2"
          case "$CV2" in
            *ZLE*) echo "  ^ ATTENTION : nie udalo sie policzyc kampanii"; fail=1;;
            *) ;;
          esac
          echo "== wysylka : nie nadajemy niezaplaconego =="
          # Une commande payee dont le colis n est jamais cree ne fait AUCUN
          # bruit. Et un colis pour une commande NON reglee, c est de la
          # marchandise donnee. Les deux regles se verifient sans base.
          WOUT=$(php -r '
            require_once "'"$DIR_API"'/shipping.php";
            $codes = array_keys(WSM_SHIP_BLOCKERS);
            $muet = false;
            foreach ($codes as $c) { if (wsm_ship_blocker_label($c) === $c) $muet = true; }
            $tel = wsm_ship_blocker_label("telefon");
            $utile = str_contains($tel, "kurier") && mb_strlen($tel) > 20;
            $conf = wsm_ship_erreur_humaine("inpost_nieskonfigurowany");
            $dit = str_contains($conf, "Ustawieni") && str_contains($conf, "ręcznie");
            $multi = wsm_ship_erreur_humaine("brakujace_dane: telefon, waga");
            $trad = str_contains($multi, "kurier") && str_contains($multi, "Waga");
            $st = count(WSM_SHIP_STATUSES) >= 4;
            echo (!$muet ? "etykiety-ok" : "etykiety-ZLE"), " ",
                 ($utile ? "powod-ok" : "powod-ZLE"), " ",
                 ($dit ? "brak-tokenu-ok" : "brak-tokenu-ZLE"), " ",
                 ($trad ? "wielo-ok" : "wielo-ZLE"), " ",
                 ($st ? "stany-ok" : "stany-ZLE");
          ' 2>&1); [ $? -eq 0 ] || WOUT="php-ZLE :: $WOUT"
          echo "  $WOUT"
          case "$WOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguly kolejki wysylki nie dzialaja"; fail=1;;
            *) ;;
          esac
          # Le chiffre qui compte en production : combien de commandes PAYEES
          # attendent encore un numero de suivi. Personne ne les cherche.
          QW="SELECT CONCAT('zaplacone_bez_sledzenia=', COUNT(*)) FROM mrszoko.wsm_orders o LEFT JOIN mrszoko.wsm_shipments s ON s.order_id = o.id WHERE o.payment_status = 'oplacone' AND o.status <> 'anulowane' AND (s.tracking_number IS NULL OR s.tracking_number = '')"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            WV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QW" 2>&1 || echo "sql-ZLE")
          else
            WV=$(mysql -N -e "$QW" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $WV"
          case "$WV" in
            *ZLE*) echo "  ^ ATTENTION : nie udalo sie policzyc kolejki wysylki"; fail=1;;
            *zaplacone_bez_sledzenia=0) ;;
            *) echo "  ^ UWAGA : zaplacone zamowienia czekaja na nadanie — otworz ekran Wysylka";;
          esac
          echo "== Allegro : kanal zamkniety, ale stan pilnowany =="
          # Le vrai danger d un second canal n est pas l API : c est le STOCK
          # PARTAGE. Les memes cinquante tablettes affichees ici ET la-bas se
          # vendent CENT fois. On verifie donc, sans compte et sans reseau,
          # qu on ne publie jamais tout, et jamais sous le prix boutique.
          AOUT=$(php -r '
            require_once "'"$DIR_API"'/allegro.php";
            $ferme = !wsm_allegro_enabled() || count(wsm_allegro_manquants()) === 0;
            $p = wsm_allegro_stock_plan(100);
            $res = $p["publikowalne"] === 80 && $p["rezerwa"] === 20
                && ($p["publikowalne"] + $p["rezerwa"]) === 100;
            $petit = wsm_allegro_stock_plan(2)["publikowalne"] === 0;
            $abs = wsm_allegro_stock_plan(100, 999)["publikowalne"] === 80;
            $pl = wsm_allegro_prix_plancher(10000) > 10000;
            $o = wsm_allegro_offer(["id"=>"x","nom"=>"Test","ean"=>"","prix_grosze"=>10000,"stock"=>50]);
            $ean = $o["_blockers"] !== [];
            echo ($ferme ? "brama-ok" : "brama-ZLE"), " ",
                 ($res ? "rezerwa-ok" : "rezerwa-ZLE"), " ",
                 ($petit && $abs ? "progi-ok" : "progi-ZLE"), " ",
                 ($pl ? "prog-ceny-ok" : "prog-ceny-ZLE"), " ",
                 ($ean ? "ean-ok" : "ean-ZLE");
          ' 2>&1); [ $? -eq 0 ] || AOUT="php-ZLE :: $AOUT"
          echo "  $AOUT"
          case "$AOUT" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguly kanalu Allegro nie dzialaja"; fail=1;;
            *) ;;
          esac
          echo "== przypomnienia : dwa listy, potem cisza =="
          # Deux messages, puis silence. Le troisieme ne recupere personne et
          # envoie l adresse d expedition dans les indesirables. Et le modele
          # doit porter un LIEN : demander un virement a quelqu un qui allait
          # payer par carte le fait renoncer une seconde fois.
          POUT2=$(php -r '
            require_once "'"$DIR_API"'/relance.php";
            $deux = count(WSM_RELANCE_ETAPES) === 2;
            $ecart = WSM_RELANCE_ODSTEP_H >= 48;
            $abandon = WSM_RELANCE_ABANDON_JOURS <= 60;
            $ferme = !wsm_relance_possible();
            $dit = str_contains(wsm_relance_blocage(), "tpay");
            echo ($deux ? "dwa-etapy-ok" : "dwa-etapy-ZLE"), " ",
                 ($ecart ? "odstep-ok" : "odstep-ZLE"), " ",
                 ($abandon ? "porzucenie-ok" : "porzucenie-ZLE"), " ",
                 ($ferme === $dit || !$ferme ? "brama-ok" : "brama-ZLE");
          ' 2>&1); [ $? -eq 0 ] || POUT2="php-ZLE :: $POUT2"
          echo "  $POUT2"
          case "$POUT2" in
            *ZLE*|*Error*|*error*) echo "  ^ ATTENTION : reguly przypomnien nie dzialaja"; fail=1;;
            *) ;;
          esac
          # Le modele doit EXISTER et porter le lien, sinon la relance est muette.
          QP="SELECT CONCAT('wzorow=', COUNT(*), ' z_linkiem=', SUM(body LIKE '%{{link}}%')) FROM mrszoko.wsm_mail_templates WHERE code LIKE 'niedokonczone%'"
          if [ -n "$DB_USER" ] && mysql -u"$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
            PV=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QP" 2>&1 || echo "sql-ZLE")
          else
            PV=$(mysql -N -e "$QP" 2>&1 || echo "sql-ZLE")
          fi
          echo "  $PV"
          case "$PV" in
            *ZLE*) echo "  ^ ATTENTION : nie udalo sie sprawdzic wzorow przypomnien"; fail=1;;
            *wzorow=0*) echo "  ^ ATTENTION : brak wzoru — przypomnienie byloby nieme"; fail=1;;
            *) ;;
          esac
          if [ "$fail" = "0" ]; then echo "ALL RULE CHECKS OK"; else echo "RULE CHECK FAILED"; exit 1; fi
          REMOTE

      # ----------------------------------------------------------------------
      #  LES TRANSPORTEURS, DANS UNE ÉTAPE À PART.
      #
      #  Même raison que pour l'argent : le validateur (tools/check-workflow.sh)
      #  a signalé « proche de la limite » à 17 600 caractères sur l'étape
      #  fulfilment. GitHub REFUSE en silence au-delà de 21 000 — course créée
      #  puis tuée, zéro job, aucun message. Ce dépôt l'a déjà payé une fois ;
      #  on scinde au premier avertissement, pas au premier échec.
      # ----------------------------------------------------------------------
      - name: Verify carriers (DPD, pallet, weight bounds)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' bash -s" << 'REMOTE'
          fail=0
          echo "== drugi przewoźnik : DPD =="
          # DEUX TRANSPORTEURS, ET LE PIÈGE N'EST PAS OÙ L'ON CROIT. Ce qui
          # casse en ajoutant DPD, ce n'est pas DPD : ce sont les quatorze
          # endroits qui demandaient « delivery_method === 'inpost_locker' »
          # pour savoir s'il fallait un code de point ou une adresse. Avec un
          # troisième nom, les deux branches répondent non — et la caisse
          # n'exige plus RIEN. Une commande part payée, sans destination.
          #
          # On vérifie donc d'abord que le TYPE de service est bien en base.
          if [ -n "$DB_USER" ]; then
            QK="SELECT CONCAT(id,'=',kind) FROM mrszoko.wsm_shipping_methods ORDER BY sort_order;"
            KINDS=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e "$QK" 2>/dev/null | tr '\n' ' ')
          else
            KINDS=$(mysql -N -e "SELECT CONCAT(id,'=',kind) FROM mrszoko.wsm_shipping_methods ORDER BY sort_order;" 2>/dev/null | tr '\n' ' ')
          fi
          echo "  metody: ${KINDS:-?}"
          case "$KINDS" in
            *"inpost_locker=punkt"*) echo "  paczkomat jest PUNKTEM — potwierdzone" ;;
            *"inpost_locker="*) echo "  ^ ZLE : paczkomat nie jest punktem — kasa poprosi o ulicę do skrytki"; fail=1 ;;
            *) echo "  ^ ATTENTION : nie udało się odczytać metod dostawy"; fail=1 ;;
          esac
          case "$KINDS" in
            *"dpd_courier=adres"*) echo "  DPD jest kurierem pod ADRES — potwierdzone" ;;
            *"dpd_courier="*) echo "  ^ ZLE : DPD ma zły typ usługi"; fail=1 ;;
            *) echo "  ^ ATTENTION : brak metody dpd_courier w bazie" ;;
          esac
          # L'API DE DPD POLSKA EST DU SOAP. On MESURE l'extension au lieu de
          # la supposer : le php de ce serveur n'a déjà pas pdo_mysql en ligne
          # de commande, et trois déploiements ont été perdus avant qu'on le
          # constate. Son absence n'est PAS un échec — la boutique vend, les
          # colis partent à la main — mais elle doit être ÉCRITE, sinon on
          # cherche des heures pourquoi « Nadaj » ne fait rien.
          SOAP=$(php -r 'echo class_exists("SoapClient") ? "jest" : "brak";' 2>/dev/null || echo "brak")
          if [ "$SOAP" = "jest" ]; then
            echo "  rozszerzenie soap: jest — DPD moze nadawac"
          else
            echo "  rozszerzenie soap: BRAK — DPD nie nada nic, dopoki nie doinstalujesz php-soap"
            echo "  (sklep sprzedaje dalej; paczki DPD nadaje sie recznie — to stan oczekiwania, nie awaria)"
          fi
          # Et le canal reste-t-il FERMÉ sans identifiants ? Un canal qu'on
          # croit ouvert alors qu'il ne l'est pas produit des commandes payées
          # dont le colis n'existe pas — le défaut le plus silencieux qui soit.
          DPDC=$(php -r '
            require_once "'"$DIR_API"'/dpd.php";
            echo wsm_dpd_enabled() ? "OTWARTY" : "zamkniety";
            echo " brakuje=", count(wsm_dpd_manquants());
          ' 2>&1)
          echo "  $DPDC"
          case "$DPDC" in
            zamkniety*) echo "  ok — nic nie wyjdzie bez poswiadczen z serwera" ;;
            OTWARTY*)   echo "  UWAGA : kanal DPD otwarty. Sprawdz, ze dane sa w config.local.php, nie w repozytorium." ;;
            *)          echo "  ^ ZLE : dpd.php nie laduje sie"; fail=1 ;;
          esac
          echo "== trzeci przewoznik : paleta od 200 kg =="
          # Deux erreurs symetriques, et aucune ne leve quoi que ce soit :
          # proposer un transport de palettes pour une tablette de chocolat, ou
          # continuer a proposer un Paczkomat pour 30 kg alors que le colis sera
          # refuse au depot. La liste se filtre donc AVANT d'etre montree.
          COLW=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT COUNT(*) FROM information_schema.columns
              WHERE table_schema='mrszoko' AND table_name='wsm_shipping_methods'
                AND column_name='min_weight_g';" 2>/dev/null || echo 0)
          [ "${COLW:-0}" = "1" ] \
            && echo "  kolumna min_weight_g : obecna" \
            || { echo "  ^ ZLE : brak min_weight_g — paleta bylaby proponowana na kazdy koszyk"; fail=1; }
          FRESH=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT CONCAT(carrier,':',min_weight_g,':',max_weight_g,':',active)
               FROM wsm_shipping_methods WHERE id='fresh_logistic';" 2>/dev/null || echo "")
          echo "  fresh_logistic : ${FRESH:-BRAK}"
          case "$FRESH" in
            fresh:200000:*) echo "  ok — prog 200 kg zapisany" ;;
            "")             echo "  ^ ZLE : metoda nie dojechala do bazy"; fail=1 ;;
            *)              echo "  UWAGA : prog zmieniony w konsoli — to dozwolone" ;;
          esac
          # Le transporteur connu mais non pilote ne doit pas passer pour
          # inconnu : « Nieznany przewoznik » enverrait chercher une faute de
          # configuration la ou la commande est parfaitement normale.
          MOUT=$(php -r '
            require_once "'"$DIR_API"'/shipping.php";
            $m = WSM_SHIP_MANUELS["fresh"] ?? "";
            $b = wsm_ship_blockers_adresse(["phone"=>"600100200","email"=>"a@b.pl",
                  "first_name"=>"Jan","weight_g"=>250000,
                  "ship"=>["street"=>"Polna","building"=>"1","postcode"=>"00-001","city"=>"Wroclaw"]]);
            echo ($m !== "" ? "reczny-ok" : "reczny-ZLE"), " ", ($b === [] ? "kontrole-ok" : "kontrole-ZLE");
          ' 2>&1); [ $? -eq 0 ] || MOUT="php-ZLE :: $MOUT"
          echo "  $MOUT"
          case "$MOUT" in *ZLE*|*Error*|*error*) echo "  ^ NOT OK"; fail=1 ;; esac

          if [ "$fail" = "0" ]; then echo "ALL CARRIER CHECKS OK"; else echo "CARRIER CHECK FAILED"; exit 1; fi
          REMOTE

      - name: Verify public shop (SEO, contact)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' DIR_SHOP='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/shop' bash -s" << 'REMOTE'
          fail=0
          # Ces deux-là vivaient dans l'étape « Verify web surfaces » : en
          # scindant, cette étape ne les avait plus. Sans « run », toutes les
          # vérifications d'URL auraient été silencieusement vides — et un
          # contrôle qui ne contrôle rien passe au vert, ce qui est pire que
          # pas de contrôle du tout.
          SH="http://localhost/mrszoko/shop"
          run() { URL="$1"; MIN="${2:-1}"
            out=$(curl -skL -o /dev/null -w "%{http_code}|%{size_download}" "$URL")
            IFS='|' read -r code size <<< "$out"
            size="${size%.*}"
            echo "  $code  ${size}b  $URL"
            if [ "$code" != "200" ] || [ "${size:-0}" -lt "$MIN" ]; then
              echo "  ^ NOT OK"; fail=1
            fi
          }
          echo "== formularz kontaktowy =="
          run "$SH/kontakt" 500
          KH=$(curl -skL "$SH/kontakt")
          echo "$KH" | grep -q 'name="firma_www"' \
            && echo "  pułapka na roboty: obecna" \
            || { echo "  ^ ATTENTION : brak pułapki — formularz zbierze spam"; fail=1; }
          echo "$KH" | grep -q 'name="_ts"' \
            && echo "  podpisany znacznik czasu: obecny" \
            || { echo "  ^ ATTENTION : brak znacznika czasu"; fail=1; }
          # Les libellés doivent EXISTER : un formulaire dont les étiquettes
          # manquent s'affiche en production avec des cases anonymes, et ça
          # marche parfaitement en développement où la base est refaite.
          echo "$KH" | grep -q 'contact\.' \
            && { echo "  ^ ATTENTION : klucz i18n wyświetlony zamiast tekstu"; fail=1; } \
            || echo "  etykiety przetłumaczone: potwierdzone"
          # LE CHOIX DU PACZKOMAT. Sans le sélecteur sur carte, on demande au
          # client d'aller chercher « KRA010 » sur inpost.pl et de revenir le
          # taper : c'est l'endroit exact où l'on abandonne un panier, et un
          # code recopié de travers envoie le colis au mauvais casier.
          #
          # ON NE DEMANDE PAS À /kasa À VIDE. Sans panier, la caisse affiche
          # « Koszyk jest pusty » et ne rend aucun champ de livraison : un
          # contrôle qui la lit conclut « pas de sélecteur » sur une boutique
          # parfaitement configurée. Premier jet écrit comme ça, essayé, faux.
          # On remplit donc un panier comme le ferait un client, puis on lit.
          echo "== wybór paczkomatu =="
          # 1. Le code est-il déployé ? Attention au motif : le champ est
          #    produit par un assistant, `name="inpost_point"` n'apparaît
          #    qu'au rendu et ne se trouve nulle part dans la source. Deuxième
          #    faux négatif de ce même bloc — d'où la déclaration réelle.
          grep -q 'inpost-geowidget' "$DIR_SHOP/index.php" \
            && echo "  selektor na mapie: w kodzie" \
            || { echo "  ^ NOT OK : sklep nie zawiera selektora paczkomatów"; fail=1; }
          grep -q "field('inpost_point'" "$DIR_SHOP/index.php" \
            && echo "  pole kodu paczkomatu: w kodzie" \
            || { echo "  ^ NOT OK : brak pola kodu — nie da się wskazać paczkomatu"; fail=1; }
          # 2. ET SURTOUT : le champ arrive-t-il vraiment dans la page ? Le
          #    code présent dans un fichier ne prouve rien — il est sous une
          #    condition. On met un article au panier et on ouvre la caisse.
          JAR=$(mktemp)
          ACC=$(curl -skL -c "$JAR" -b "$JAR" "$SH/")
          PID=$(printf '%s' "$ACC" | grep -o 'name="add" value="[^"]*"' | head -1 | sed 's/.*value="//; s/"$//')
          TOK=$(printf '%s' "$ACC" | grep -o 'name="_t" value="[^"]*"' | head -1 | sed 's/.*value="//; s/"$//')
          if [ -z "$PID" ] || [ -z "$TOK" ]; then
            echo "  ^ NOT OK : strona główna nie oferuje żadnego produktu do koszyka"; fail=1
          else
            curl -skL -c "$JAR" -b "$JAR" -o /dev/null \
              -d "_t=$TOK" -d "add=$PID" -d "qty=1" "$SH/koszyk"
            KA=$(curl -skL -c "$JAR" -b "$JAR" "$SH/kasa")
            case "$KA" in
              *'id="f-inpost_point"'*) echo "  pole paczkomatu w kasie: renderowane (koszyk z 1 produktem)";;
              *'Koszyk jest pusty'*|*'cart.empty'*)
                echo "  ^ NOT OK : dodanie do koszyka nie zadziałało — kasa pusta"; fail=1;;
              *) echo "  ^ NOT OK : kasa nie pokazuje pola paczkomatu"; fail=1;;
            esac
            # 3. LA PAGE RENDUE EST LE SEUL JUGE DU JETON.
            #
            # Il y avait ici une seconde question, posée à php-cli :
            # `wsm_inpost_geowidget_token()`. Elle répondait « BRAK » sur une
            # boutique où le sélecteur s'affichait parfaitement — deux lignes
            # qui se contredisaient dans le même bloc de journal.
            #
            # La raison n'a rien à voir avec InPost. Le jeton est saisi dans
            # l'écran Ustawienia, donc rangé en BASE, et il n'entre en vigueur
            # que par la surcouche que wsm_bootstrap() applique après avoir
            # ouvert la connexion. Or php-cli n'a pas pdo_mysql sur ce serveur
            # — seul le SAPI web l'a. La sonde ne pouvait donc JAMAIS voir un
            # jeton configuré depuis la console, et annonçait une panne qui
            # n'existait pas. (Même piège qu'au déploiement 79.)
            #
            # Ce que reçoit le client est de toute façon la vraie réponse.
            case "$KA" in
              *'<inpost-geowidget'*)
                echo "  selektor na mapie: AKTYWNY — token ustawiony, klient wybiera na mapie";;
              *)
                echo "  selektor na mapie: nieaktywny — brak tokenu; klient wpisuje kod ręcznie (pole działa)";;
            esac
          fi
          rm -f "$JAR"

          echo "== SEO : nic prywatnego w indeksie, hreflang bezwzględne =="
          # La page de suivi porte nom, adresse et détail d'achat. Un lien
          # partagé, ou suivi par un robot depuis une boîte mail, et la
          # commande de quelqu'un devient cherchable. Cette ligne passe avant
          # tout le reste du référencement.
          for pg in koszyk kasa zamowienie/MS-TEST; do
            H=$(curl -skL "$SH/$pg")
            case "$H" in
              *'name="robots" content="noindex'*) echo "  /$pg : noindex — potwierdzone";;
              *) echo "  ^ FUITE : /$pg może trafić do wyszukiwarki"; fail=1;;
            esac
          done
          # Un hreflang relatif est ignoré en bloc par Google, sans un mot dans
          # la Search Console : la grappe entière ne sert alors à rien.
          HOME_HTML=$(curl -skL "$SH/")
          if echo "$HOME_HTML" | grep -q 'hreflang=' ; then
            if echo "$HOME_HTML" | grep -oE 'hreflang="[a-z-]+" href="[^"]+"' | grep -qv 'href="http'; then
              echo "  ^ ATTENTION : hreflang względny — Google zignoruje całą grupę"; fail=1
            else
              echo "  hreflang bezwzględne : potwierdzone"
            fi
            echo "$HOME_HTML" | grep -q 'hreflang="x-default"' \
              && echo "  x-default obecny" \
              || { echo "  ^ ATTENTION : brak x-default — grupa jest niekompletna"; fail=1; }
          else
            echo "  ^ ATTENTION : sklep nie emituje hreflang"; fail=1
          fi
          echo "$HOME_HTML" | grep -q 'rel="canonical" href="http' \
            && echo "  kanoniczny bezwzględny : potwierdzone" \
            || { echo "  ^ ATTENTION : brak kanonicznego albo względny"; fail=1; }
          # Chaque langue doit être une VRAIE page (200), pas une redirection :
          # sinon toute la grappe pointe vers une seule adresse et le
          # multilingue ne référence rien.
          # On SUIT les redirections : le serveur renvoie d'abord un 308 vers
          # HTTPS, et le lire comme la réponse de la page ferait échouer un
          # contrôle parfaitement sain. Ce qu'on vérifie, c'est l'adresse
          # d'ARRIVÉE : si « ?lang=en » atterrit sans sa langue, toute la
          # grappe hreflang pointe vers une seule page.
          for L in en uk; do
            EFF=$(curl -skL -o /dev/null -w '%{http_code}|%{url_effective}' "$SH/?lang=$L")
            IFS='|' read -r C U <<< "$EFF"
            case "$C|$U" in
              200*lang=$L*) echo "  /?lang=$L → 200, język zachowany w adresie";;
              200*) echo "  ^ ATTENTION : /?lang=$L ląduje na $U — grupa hreflang wskazuje jedną stronę"; fail=1;;
              *) echo "  ^ ATTENTION : /?lang=$L odpowiada $C"; fail=1;;
            esac
          done
          run "$SH/robots.txt" 20
          run "$SH/sitemap.xml" 200
          curl -skL "$SH/sitemap.xml" | grep -q 'xmlns:xhtml' \
            && echo "  sitemap deklaruje alternates" \
            || { echo "  ^ ATTENTION : sitemap bez xhtml:link"; fail=1; }
          curl -skL "$SH/sitemap.xml" | grep -qE '/(koszyk|kasa|zamowienie)' \
            && { echo "  ^ FUITE : sitemap wymienia stronę prywatną"; fail=1; } \
            || echo "  sitemap nie wymienia stron prywatnych"

          echo "== wejście B2B ze strony głównej =="
          # LE TEXTE A-T-IL VRAIMENT CHANGÉ ? La synchronisation est un INSERT
          # IGNORE : elle protège ce qui a été écrit en console, et elle avale
          # en silence tout texte MODIFIÉ dans le dépôt. wsm_content_forces()
          # est la sortie de secours — mais elle passe par le client mysql, et
          # « contenu éditorial : synchronisé » ne prouve QUE l'exécution du
          # script. Ici on regarde la page réelle : si l'ancien bloc « Strefa
          # pro » est encore servi, le déploiement est vert et la vitrine est
          # périmée. C'est la panne exacte qu'on est en train de réparer.
          case "$HOME_HTML" in
            *'Strefa pro'*|*'40 kg'*)
              echo "  ^ ZLE : stary blok « Strefa pro » nadal na stronie — treść nie doszła"; fail=1;;
            *'id="pro"'*) echo "  blok B2B jest na stronie — potwierdzone";;
            *) echo "  ^ ATTENTION : brak bloku B2B na stronie głównej"; fail=1;;
          esac
          # Le bouton mène au FORMULAIRE, sujet déjà posé. Un « mailto: »
          # suppose un client de messagerie configuré : au bureau il ouvre
          # Outlook chez les uns et rien du tout chez les autres, et le
          # prospect referme l'onglet sans qu'on le sache jamais.
          case "$HOME_HTML" in
            *'mailto:'*'#pro'*|*'#pro'*'mailto:'*)
              echo "  ^ ATTENTION : blok B2B nadal proponuje mailto";;
          esac
          case "$HOME_HTML" in
            *'kontakt?temat=wspolpraca'*|*'kontakt&#63;temat=wspolpraca'*)
              echo "  przycisk prowadzi do formularza z tematem — potwierdzone";;
            *) echo "  ^ ZLE : przycisk B2B nie prowadzi do formularza z tematem"; fail=1;;
          esac
          # Et le formulaire présélectionne CE sujet. Sans cette ligne le
          # paramètre serait décoratif : la demande arriverait classée « inne »,
          # au milieu du tout-venant, et personne ne le verrait avant de
          # dépouiller la Poczta.
          KH=$(curl -skL "$SH/kontakt?temat=wspolpraca")
          case "$KH" in
            *'value="wspolpraca" selected'*) echo "  formularz otwiera się na « Współpraca / hurt » — potwierdzone";;
            *) echo "  ^ ZLE : formularz ignoruje temat z adresu"; fail=1;;
          esac
          # Un paramètre inventé ne doit RIEN présélectionner : il vient du
          # visiteur, pas de nous.
          case "$(curl -skL "$SH/kontakt?temat=nie-ma-takiego")" in
            *' selected'*) echo "  ^ ZLE : formularz przyjmuje wymyślony temat"; fail=1;;
            *) echo "  wymyślony temat nic nie zaznacza — potwierdzone";;
          esac
          # Le sujet du mailto n'a plus de lecteur : laissé en base il resterait
          # éditable dans Treści, quelqu'un le soignerait, et rien ne changerait.
          if [ -n "$DB_USER" ]; then
            NMS=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -e \
              "SELECT COUNT(*) FROM mrszoko.wsm_shop_i18n WHERE k='story.pro.mail_subject'" 2>/dev/null || echo '?')
            case "$NMS" in
              0) echo "  martwy klucz story.pro.mail_subject usunięty — potwierdzone";;
              '?') echo "  ^ ATTENTION : nie udało się sprawdzić martwego klucza";;
              *) echo "  ^ ATTENTION : story.pro.mail_subject nadal w bazie ($NMS) — edytowalny, bez efektu";;
            esac
          fi

          if [ "$fail" = "0" ]; then echo "ALL SHOP CHECKS OK"; else echo "SHOP CHECK FAILED"; exit 1; fi
          REMOTE


      # Le pendant en ligne de la garde du build. Le build garantit que chaque
      # entrée du rail a son FICHIER ; celle-ci garantit qu'elle a une PAGE.
      # Étape à part, et pas ajoutée à « Verify web surfaces » : cette
      # expression frôlait déjà les 17 000 caractères, et au-delà de 21 000
      # GitHub rejette le fichier EN SILENCE — zéro job, aucun message. Le
      # contrôle qui n'existe pas est celui qu'on a mis dans l'étape de trop.
      - name: Verify console screens answer (rail-derived)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DIR_BO='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice' bash -s" << 'REMOTE'
          fail=0
          BO="http://localhost/mrszoko/backoffice"
          # Sept écrans livrés n'avaient jamais été copiés par l'assemblage, et
          # six étaient morts en production depuis leur mise en ligne : aucun
          # écran .php n'était vérifié en ligne. Sans session la console renvoie
          # vers sa page de connexion ; ce qu'on refuse, c'est 404 et 500 — une
          # page absente ne redirige pas, et une page qui explose non plus.
          #
          # La liste n'est PAS écrite ici : elle est DEMANDÉE au rail déployé.
          # Une seconde liste à tenir à jour reproduirait exactement la panne
          # qu'on vient de réparer, avec un cran de retard supplémentaire.
          # LA PORTE, POUR DE VRAI. Une page de connexion qui répond 200 mais
          # ne porte pas de formulaire est une console inaccessible, et rien
          # d'autre ici ne s'en apercevrait.
          LH=$(curl -skL "$BO/login.php")
          echo "$LH" | grep -q 'name="password"' \
            && echo "  formularz logowania: obecny" \
            || { echo "  ^ NOT OK : brak pola hasła — nikt się nie zaloguje"; fail=1; }
          echo "$LH" | grep -q 'name="_t"' \
            && echo "  token CSRF: obecny" \
            || { echo "  ^ NOT OK : formularz bez tokenu CSRF"; fail=1; }
          # Sans JavaScript, et c'est le sujet : un script qui ne charge pas ne
          # doit plus pouvoir fermer la porte.
          echo "$LH" | grep -q '<script' \
            && { echo "  ^ ATTENTION : strona logowania zależy od JavaScriptu"; fail=1; } \
            || echo "  logowanie bez JavaScriptu: potwierdzone"
          # L'ancienne adresse doit continuer de mener quelque part.
          curl -skL "$BO/index.html" | grep -q 'login.php' \
            && echo "  index.html kieruje na login.php" \
            || { echo "  ^ NOT OK : stary adres prowadzi donikąd"; fail=1; }
          # Et les 1,2 Mo doivent avoir disparu du serveur.
          #
          # -L, ENCORE. Ce serveur impose HTTPS : toute URL en http reçoit
          # d'abord un 301, et le lire comme la réponse du fichier fait
          # conclure « toujours servi » sur des fichiers parfaitement absents.
          # C'est la deuxième fois dans ce chantier — au déploiement 76 puis
          # ici. Le commentaire reste pour la troisième.
          for mort in /support.js /bo_server.js /menu_api.js /menu_seed.js /vendor/react-dom.js; do
            MC=$(curl -skL -o /dev/null -w '%{http_code}' "$BO$mort")
            case "$MC" in
              404|403) echo "  $MC  $mort (retiré)" ;;
              *) echo "  ^ ZLE : $mort répond encore $MC — l'ancienne console est toujours servie"; fail=1 ;;
            esac
          done

          ECRANS=$(php -r '
            require_once "'"$DIR_BO"'/console.php";
            foreach (console_sections(["role" => "Centrala"]) as $i)
              foreach (array_keys($i) as $f) echo $f, " ";
          ' 2>/dev/null)
          if [ -z "$ECRANS" ]; then
            echo "  ^ NOT OK : impossible de lire le rail (console.php)"; fail=1
          fi
          for e in $ECRANS; do
            EC=$(curl -skL -o /dev/null -w "%{http_code}" "$BO/$e")
            case "$EC" in
              200|302|303) echo "  $EC  $e" ;;
              *) echo "  $EC  $e  ^ NOT OK"; fail=1 ;;
            esac
          done
          # ── L'ÉCRAN DE LA PLATEFORME NE S'OUVRE PAS SANS SESSION ──────────
          # Il chiffre ce que la boutique doit à qui la lui loue.
          #
          # ON REGARDE OÙ L'ON ATTERRIT, PAS LE CODE. Le premier jet lisait
          # « %{http_code} » après un -L et refusait 200 : sauf qu'avec -L le
          # code rendu est celui de la DESTINATION. Sans session on est
          # redirigé vers login.php, qui répond 200 — le contrôle criait donc
          # à la fuite sur une console parfaitement fermée, et il a fait
          # échouer le déploiement 91. C'est le pendant exact du piège des
          # déploiements 76 et 85, où l'oubli de -L faisait lire le 301.
          # L'adresse d'arrivée, elle, ne ment pas.
          SAU=$(curl -skL -o /dev/null -w "%{url_effective}" "$BO/superadmin.php")
          case "$SAU" in
            *login.php*) echo "  superadmin.php bez sesji: przekierowanie na logowanie — nie otwiera się" ;;
            *superadmin.php*) echo "  ^ ZLE : superadmin.php otwiera się BEZ logowania"; fail=1 ;;
            *) echo "  superadmin.php bez sesji: ląduje na $SAU — nie otwiera się" ;;
          esac

          # ── LE REJESTRATOR STRON ──────────────────────────────────────────
          # Il tourne sur CHAQUE écran de la console. Deux choses peuvent
          # rater sans bruit : le branchement peut disparaître d'un
          # console.php réécrit, et les tables peuvent ne pas être créées sur
          # une base déjà existante — CREATE TABLE IF NOT EXISTS ne rattrape
          # que les bases neuves. Dans les deux cas l'écran Superadmin
          # afficherait des zéros, ce qui se lit comme « personne ne travaille »
          # au lieu de « on ne mesure rien ». On vérifie donc les deux.
          echo "== rejestrator stron =="
          grep -q 'wsm_console_mesure' "$DIR_BO/console.php" \
            && echo "  pomiar wpięty w console_boot: tak" \
            || { echo "  ^ NOT OK : konsola nie mierzy niczego"; fail=1; }
          [ -f "$DIR_BO/api/usage.php" ] \
            && echo "  usage.php dojechał" \
            || { echo "  ^ NOT OK : brak api/usage.php"; fail=1; }
          # La règle qui compte : ni adresse complète, ni personne. On la lit
          # dans le code déployé, pas dans le dépôt — c'est le code déployé qui
          # écrit en base.
          grep -q 'HTTP_REFERER' "$DIR_BO/console.php" \
            && grep -q 'wsm_usage_skad' "$DIR_BO/api/usage.php" \
            && echo "  referer filtrowany przez usage.php: tak" \
            || { echo "  ^ ATTENTION : referer trafia gdzie indziej"; fail=1; }
          # ── LE STATUT EST UN BOUTON ────────────────────────────────────────
          # Zamówienia est l'écran le plus ouvert de la maison, et changer un
          # statut y est devenu le geste d'un doigt. Trois pièces doivent être
          # arrivées ensemble : la fonction qui calcule les étapes, l'écran qui
          # les poste, et le style qui leur donne une taille touchable. Le
          # rsync tourne SANS --delete et l'assemblage a déjà oublié des
          # fichiers : deux pièces sur trois, et l'écran répond 200 avec des
          # pastilles de 24 px que personne ne peut viser au pouce.
          # ── LA PHOTO DU HAUT DE PAGE ───────────────────────────────────────
          # Trois pièces, encore une fois, et aucune ne dit rien toute seule :
          # sans le type « image » le champ accepte un fichier et n'enregistre
          # rien, sans la section « shop » dans config.php le réglage ne
          # redescend jamais jusqu'à la vitrine, et sans la classe le fond
          # reste le dégradé. Le rsync tourne sans --delete : un fichier oublié
          # à l'assemblage laisse l'ancienne version en place, silencieusement.
          echo "== zdjecie na stronie glownej =="
          grep -q "'hero_image'" "$DIR_BO/api/settings.php" \
            && grep -q "'shop' =>" "$DIR_BO/api/config.php" \
            && grep -q 'hero--foto' "$DIR_BO/../shop/shop.css" \
            && echo "  pole zdjecia + config + styl: obecne" \
            || { echo "  ^ NOT OK : pole zdjecia na stronie glownej niekompletne"; fail=1; }
          echo "== statusy jako przyciski =="
          ETP=$(php -r 'require_once "'"$DIR_BO"'/api/invoice.php"; echo function_exists("wsm_order_etapy") ? "jest" : "brak";' 2>&1)
          case "$ETP" in
            jest) echo "  wsm_order_etapy(): dojechało" ;;
            *) echo "  ^ NOT OK : brak wsm_order_etapy() — status wróci do listy rozwijanej ($ETP)"; fail=1 ;;
          esac
          grep -q 'name="status"' "$DIR_BO/zamowienia.php" \
            && grep -q 'wsm_order_etapy' "$DIR_BO/zamowienia.php" \
            && echo "  lista zamówień posyła status: tak" \
            || { echo "  ^ NOT OK : lista nie zmienia statusu"; fail=1; }
          # 44 px, pas 24 : c'est la taille au-dessous de laquelle un pouce rate
          # sa cible. Sans la feuille de style à jour, les boutons existent et
          # sont inutilisables sur le téléphone qui sert à s'en servir.
          grep -q 'min-height: 44px' "$DIR_BO/console.css" \
            && grep -q '\.etap' "$DIR_BO/console.css" \
            && echo "  styl etapów (44 px pod kciuk): obecny" \
            || { echo "  ^ NOT OK : console.css bez stylu etapów"; fail=1; }
          # Et le client reste prévenu depuis la liste : sans ce champ, « twoja
          # paczka wyszła » cesserait de partir sans que rien ne le dise.
          grep -q 'name="powiadom"' "$DIR_BO/zamowienia.php" \
            && echo "  powiadomienie klienta z listy: tak" \
            || { echo "  ^ ATTENTION : zmiana statusu z listy nie powiadomi klienta"; fail=1; }
          # LA LISTE DOIT PORTER CE QUE LES VOYANTS LISENT. Sans vat_eu ni
          # vat_status, une commande B2B confirmée par VIES s'affiche « brak
          # numeru VAT UE » et annonce un paragon, pendant qu'une FACTURE part
          # au registre national. Aucune erreur nulle part — juste un écran qui
          # dit le contraire de ce qu'il fait.
          php -r '
            require_once "'"$DIR_BO"'/api/shop.php";
            $r = new ReflectionFunction("wsm_orders_list");
            $src = implode("", array_slice(file($r->getFileName()),
                     $r->getStartLine() - 1, $r->getEndLine() - $r->getStartLine() + 1));
            $manque = [];
            foreach (["vat_eu", "vat_status", "company", "paid_at"] as $c)
              if (!str_contains($src, "\x27" . $c . "\x27")) $manque[] = $c;
            if ($manque) { fwrite(STDERR, "  ^ ZLE : lista nie wozi: " . implode(", ", $manque) . "\n"); exit(1); }
            echo "  lista wozi pola, które czytają kontrolki\n";
          ' || fail=1
          # Le contrôle d'avant-expédition et les files : trois pièces, même règle
          # qu'au-dessus — deux sur trois donnent un écran qui a l'air de marcher.
          php -r 'require_once "'"$DIR_BO"'/api/invoice.php";
                  exit(function_exists("wsm_order_preflight") ? 0 : 1);' \
            && echo "  wsm_order_preflight(): dojechało" \
            || { echo "  ^ NOT OK : brak kontroli przed wysyłką"; fail=1; }
          grep -q 'name="ids\[\]"' "$DIR_BO/zamowienia.php" \
            && grep -q 'kolejka' "$DIR_BO/zamowienia.php" \
            && grep -q '\.przed' "$DIR_BO/console.css" \
            && echo "  kolejki, zaznaczanie i lista kontrolna: obecne" \
            || { echo "  ^ NOT OK : wysyłka hurtem niekompletna"; fail=1; }
          # LES DEUX VUES PARTENT ENSEMBLE. Le sélecteur sans la tablica donne
          # un onglet qui mène à une page vide ; la tablica sans son CSS donne
          # trois colonnes empilées sur toute la hauteur. Aucun des deux ne
          # lève d'erreur : l'écran répond 200 et devient inutilisable.
          grep -q 'class="tablica"' "$DIR_BO/zamowienia.php" \
            && grep -q '\.widoki' "$DIR_BO/console.css" \
            && grep -q 'tr\.szuflada' "$DIR_BO/console.css" \
            && echo "  dwa widoki (lista + tablica) i szuflada: obecne" \
            || { echo "  ^ NOT OK : brakuje jednego z widoków zamówień"; fail=1; }
          # Le tiroir doit être FERMÉ au repos. Ouvert par défaut, on retombe
          # sur la panne qu'on vient de réparer : 420 px par commande.
          grep -q 'tr\.szuflada { display: none' "$DIR_BO/console.css" \
            && echo "  szuflada domyślnie zamknięta: potwierdzone" \
            || { echo "  ^ ZLE : szuflada otwarta domyślnie — wraca 420 px na zamówienie"; fail=1; }
          # UNE SEULE FAMILLE DE TEXTE, et elle doit le rester. Plus Jakarta
          # Sans a quitté la marque ; elle était déjà revenue une fois par une
          # régénération de fonts.css, et personne ne l'a signalé — deux sans
          # humanistes qui se ressemblent ne cassent rien, ils fatiguent.
          # Le contrôle vit ICI aussi : les deux voies de secours le portaient
          # déjà, la voie de référence non, donc la garantie n'en était pas une.
          grep -q "Plus Jakarta Sans'" "$DIR_BO/_ds/mister-szoko/tokens/fonts.css" \
            && { echo "  ^ ZLE : Plus Jakarta Sans wróciła — marka ma jedną rodzinę tekstu"; fail=1; } \
            || echo "  typografia: jedna rodzina tekstu (Mulish) — potwierdzone"
          # Et le plancher de taille : 29 % des règles vivaient sous 12 px.
          grep -qE 'font-size: *(9|10|11)(\.[0-9])?px' "$DIR_BO/console.css" \
            && { echo "  ^ ZLE : wróciły rozmiary poniżej 12 px"; fail=1; } \
            || echo "  skala: nic poniżej 12 px — potwierdzone"

          if [ "$fail" = "0" ]; then echo "ALL CONSOLE SCREENS OK"; else echo "CONSOLE SCREENS FAILED"; exit 1; fi
          REMOTE


      # Le nom des secrets de CE dépôt est SSH_USER / SSH_HOST / SSH_PASSWORD et
      # le port vient de vars.SSH_PORT. Le premier jet de cette étape a été
      # copié d'un autre gabarit (DEPLOY_USER, DEPLOY_HOST, DEPLOY_PORT) et
      # oubliait le bloc env : sshpass s'est retrouvé sans mot de passe et la
      # cible valait « @ ». Il n'a pas échoué sur la vérification — il a affiché
      # son mode d'emploi, ce qui ne ressemble à rien de connu quand on lit un
      # journal de déploiement. Toutes les autres étapes utilisent exactement
      # ces quatre lignes ; celle-ci aussi, maintenant.
      - name: Verify the page recorder writes, and writes nothing personal
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' bash -s" << 'REMOTE'
          fail=0
          q() { mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e "$1" 2>/dev/null || echo ""; }

          echo "== tabele rejestratora =="
          # php-cli de ce serveur n'a pas pdo_mysql : on passe par le client
          # mysql, comme partout ailleurs dans ce déploiement.
          for t in wsm_page_views wsm_page_paths; do
            N=$(q "SELECT COUNT(*) FROM information_schema.tables
                   WHERE table_schema='mrszoko' AND table_name='$t';")
            [ "${N:-0}" = "1" ] \
              && echo "  $t : obecna" \
              || { echo "  ^ ZLE : brak tabeli $t — Superadmin pokaże same zera"; fail=1; }
          done

          echo "== czego w nich NIE MA =="
          # LE contrôle qui vaut le déplacement. Un enregistreur qui ramasse
          # l'adresse complète ou l'identité de la personne devient un fichier
          # nominatif que personne n'a déclaré — et ça ne se voit pas à l'œil,
          # parce que la page a exactement la même allure dans les deux cas.
          # On interroge donc le SCHÉMA RÉEL, pas le fichier .sql du dépôt.
          COLS=$(q "SELECT GROUP_CONCAT(column_name ORDER BY column_name)
                    FROM information_schema.columns
                    WHERE table_schema='mrszoko' AND table_name='wsm_page_views';")
          echo "  wsm_page_views : ${COLS:-?}"
          case "$COLS" in
            *user*|*email*|*imie*|*nazwisko*|*url*|*query*|*ip*)
              echo "  ^ ZLE : kolumna wskazuje na osobę albo pełny adres"; fail=1 ;;
            *) echo "  brak kolumny z osobą i z pełnym adresem — potwierdzone" ;;
          esac
          # Et par les VALEURS, parce qu'une colonne bien nommée peut très bien
          # contenir « faktury.php?klient=Kowalski ».
          SALE=$(q "SELECT COUNT(*) FROM wsm_page_views WHERE ekran LIKE '%?%' OR ekran LIKE '%=%';")
          [ "${SALE:-0}" = "0" ] \
            && echo "  żaden zapis nie zawiera parametrów adresu" \
            || { echo "  ^ ZLE : $SALE zapisów z query stringiem"; fail=1; }
          SALE2=$(q "SELECT COUNT(*) FROM wsm_page_paths WHERE skad LIKE '%?%' OR dokad LIKE '%?%';")
          [ "${SALE2:-0}" = "0" ] \
            && echo "  przejścia też są czyste" \
            || { echo "  ^ ZLE : $SALE2 przejść z query stringiem"; fail=1; }

          # Combien de mesures ? Zéro n'est PAS une faute sur un déploiement
          # neuf — personne ne s'est encore connecté. On le dit sans accuser.
          VUES=$(q "SELECT COALESCE(SUM(n), 0) FROM wsm_page_views;")
          echo "  odsłon w bazie: ${VUES:-0}"
          [ "${VUES:-0}" = "0" ] && echo "  (jeszcze nikt nie wszedł po tym wdrożeniu — to nie jest usterka)"

          echo "== profile: tabele i dwie zasady, ktorych nie wolno zlamac =="
          # Les profils sont modifiables depuis la console (roles.php). Deux
          # regles protegent la console d'elle-meme, et il ne suffit pas
          # qu'elles soient ECRITES : on les exerce sur le serveur, sur le
          # code LIVRE, avec le php du serveur.
          for t in wsm_role_profiles wsm_role_screens; do
            N=$(q "SELECT COUNT(*) FROM information_schema.tables
                   WHERE table_schema='mrszoko' AND table_name='$t';")
            [ "${N:-0}" = "1" ] \
              && echo "  $t : obecna" \
              || { echo "  ^ ZLE : brak tabeli $t — nie da sie zmienic zadnego profilu"; fail=1; }
          done
          # php-cli n'a pas pdo_mysql : ces deux regles sont PURES (elles ne
          # lisent aucune base), donc elles s'exercent quand meme.
          POUT=$(php -r '
            require_once "/var/www/html/mrszoko/backoffice/api/db.php";
            require_once "/var/www/html/mrszoko/backoffice/api/delivery.php";
            require_once "/var/www/html/mrszoko/backoffice/api/auth.php";
            require_once "/var/www/html/mrszoko/backoffice/api/roles.php";
            $fixes = wsm_profil_modifiable("Administrator") || wsm_profil_modifiable("Superadmin");
            $plat  = wsm_profil_nettoie(["superadmin.php" => "w", "pulpit.php" => "r"]);
            $sat   = wsm_profil_nettoie(["wysylka.php" => "w"]);
            echo $fixes ? "pelne-ZLE" : "pelne-ok", " ",
                 isset($plat["superadmin.php"]) ? "platforma-ZLE" : "platforma-ok", " ",
                 (($sat["etykieta_dpd.php"] ?? "") === "w") ? "satelity-ok" : "satelity-ZLE";
          ' 2>&1)
          echo "  $POUT"
          case "$POUT" in
            *ZLE*|*Error*|*error*) echo "  ^ NOT OK"; fail=1 ;;
          esac

          if [ "$fail" = "0" ]; then echo "ALL RECORDER CHECKS OK"; else echo "RECORDER CHECK FAILED"; exit 1; fi
          REMOTE


      - name: Verify tax rules (KSeF FA(2))
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DB_USER='${{ secrets.WSM_DB_USER }}' DB_PASS='${{ secrets.WSM_DB_PASS }}' DIR_API='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice/api' DIR_BO='${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}/backoffice' bash -s" << 'REMOTE'
          fail=0
          echo "== pliki dojechały =="
          # Le déploiement renomme php-api en api. Un require qui nomme
          # « php-api » marche en développement et tombe en 500 ici. On ouvre
          # donc le fichier depuis SON emplacement réel, pas depuis une copie.
          for f in "$DIR_API/ksef.php" "$DIR_BO/ksef.php"; do
            [ -f "$f" ] && echo "  obecny: $f" || { echo "  ^ BRAK: $f"; fail=1; }
          done
          grep -q "php-api" "$DIR_BO/ksef.php" \
            && { echo "  ^ ZLE : ekran nazywa katalog php-api, którego tu nie ma"; fail=1; } \
            || echo "  ekran nie nazywa php-api"

          echo "== kanał jest ZAMKNIĘTY dopóki nie ma poświadczeń =="
          # Le dépôt est public : aucun jeton KSeF ne doit y vivre. Si le canal
          # est ouvert ici, il ne peut lêtre que par config.local.php — et on
          # veut le voir écrit, pas le supposer.
          KO=$(php -r '
            require_once "'"$DIR_API"'/ksef.php";
            $ouvert = wsm_ksef_enabled();
            $manque = wsm_ksef_manquants();
            echo $ouvert ? "OTWARTY" : "zamkniety", " brakuje=", count($manque);
          ' 2>&1)
          echo "  $KO"
          case "$KO" in
            zamkniety*) echo "  ok — nic nie wyjdzie bez poświadczeń z serwera" ;;
            OTWARTY*)   echo "  UWAGA : kanał otwarty. Sprawdź, że token pochodzi z config.local.php, nie z repozytorium." ;;
            *)          echo "  ^ ZLE : ksef.php nie ładuje się"; fail=1 ;;
          esac

          echo "== rozbicie VAT : pomyłka tutaj nie zgłasza się sama =="
          # LE danger du format. Un montant rangé dans le mauvais champ passe
          # la validation du schéma et fausse la déclaration. En particulier :
          # le 0 % intérieur et le 0 % intracommunautaire s'écrivent tous deux
          # « 0 » sur le papier et vont dans DEUX champs différents.
          VOUT=$(php -r '
            require_once "'"$DIR_API"'/ksef.php";
            $mk = function (array $l, int $rc = 0): array {
              return ["kind" => "faktura", "number" => "FV/1", "issued_at" => "2026-08-06",
                      "sold_at" => "2026-08-06", "due_at" => "2026-08-20", "currency" => "PLN",
                      "seller_name" => "X", "seller_nip" => "8971902620",
                      "seller_address" => "ul. Polna 1, 00-002 Wroclaw, PL",
                      "buyer_name" => "Y", "buyer_nip" => "5252248481", "buyer_vat_eu" => $rc ? "DE811569869" : "",
                      "buyer_address" => "ul. Kwiatowa 7, 00-001 Warszawa, PL",
                      "iban" => "", "bank" => "", "paid" => 0, "note" => "", "ksef_number" => "",
                      "reverse_charge" => $rc, "total_net" => 0, "total_vat" => 0,
                      "total_gross" => 20000, "items" => $l];
            };
            $li = function (float $r, int $net, int $vat): array {
              return ["name" => "A", "qty" => 1, "unit_net" => $net, "unit_gross" => $net + $vat,
                      "vat_rate" => $r, "line_net" => $net, "line_vat" => $vat,
                      "line_gross" => $net + $vat];
            };
            $p23 = wsm_ksef_pola_vat($mk([$li(0.23, 16260, 3740)]));
            $p8  = wsm_ksef_pola_vat($mk([$li(0.08, 10000, 800)]));
            $p5  = wsm_ksef_pola_vat($mk([$li(0.05, 10000, 500)]));
            $pw  = wsm_ksef_pola_vat($mk([$li(0.0, 20000, 0)], 1));
            $p0  = wsm_ksef_pola_vat($mk([$li(0.0, 20000, 0)]));
            $ok23 = ($p23["P_13_1"] ?? "") === "162.60" && ($p23["P_14_1"] ?? "") === "37.40";
            $ok8  = ($p8["P_13_2"] ?? "") === "100.00" && ($p8["P_14_2"] ?? "") === "8.00";
            $ok5  = ($p5["P_13_3"] ?? "") === "100.00" && ($p5["P_14_3"] ?? "") === "5.00";
            $okW  = ($pw["P_13_6_2"] ?? "") === "200.00" && !isset($pw["P_13_6_1"]);
            $ok0  = ($p0["P_13_6_1"] ?? "") === "200.00" && !isset($p0["P_13_6_2"]);
            $okN  = wsm_ksef_nip("PL 897-190-26-20") === "8971902620" && wsm_ksef_nip("897190262") === "";
            $okK  = wsm_ksef_kwota(5) === "0.05" && wsm_ksef_kwota(123456789) === "1234567.89";
            echo ($ok23 ? "23-ok" : "23-ZLE"), " ", ($ok8 ? "8-ok" : "8-ZLE"), " ",
                 ($ok5 ? "5-ok" : "5-ZLE"), " ", ($okW ? "wdt-ok" : "wdt-ZLE"), " ",
                 ($ok0 ? "zero-krajowe-ok" : "zero-krajowe-ZLE"), " ",
                 ($okN ? "nip-ok" : "nip-ZLE"), " ", ($okK ? "grosze-ok" : "grosze-ZLE");
          ' 2>&1)
          echo "  $VOUT"
          case "$VOUT" in *ZLE*|*Error*|*error*) echo "  ^ NOT OK"; fail=1 ;; esac

          echo "== dokument i odmowy =="
          # Le XML doit être BIEN FORMÉ — un parseur strict, pas un grep — et
          # les documents qui ne sont pas des factures doivent être refusés :
          # déposer un e-paragon inscrirait au registre national un document
          # qui nexiste pas pour le fisc.
          DOUT=$(php -r '
            require_once "'"$DIR_API"'/ksef.php";
            if (!in_array("sqlite", PDO::getAvailableDrivers(), true)) { echo "nie-sprawdzono-brak-sqlite"; exit; }
            $p = new PDO("sqlite::memory:", null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $inv = ["kind" => "faktura", "number" => "FV/001/08/26", "issued_at" => "2026-08-06",
                    "sold_at" => "2026-08-05", "due_at" => "2026-08-20", "currency" => "PLN",
                    "seller_name" => "ATELIER WRO01 sp. z o.o.", "seller_nip" => "8971902620",
                    "seller_address" => "ul. Polna 1, 00-002 Wroclaw, PL",
                    "buyer_name" => "Kowalski & Synowie", "buyer_nip" => "5252248481",
                    "buyer_vat_eu" => "", "buyer_address" => "ul. Kwiatowa 7, 00-001 Warszawa, PL",
                    "iban" => "PL61 1090 1014 0000 0712 1981 2874", "bank" => "Test",
                    "paid" => 0, "note" => "", "ksef_number" => "", "reverse_charge" => 0,
                    "total_net" => 16260, "total_vat" => 3740, "total_gross" => 20000,
                    "items" => [["name" => "Czekolada", "qty" => 2, "unit_net" => 8130,
                                 "unit_gross" => 10000, "vat_rate" => 0.23, "line_net" => 16260,
                                 "line_vat" => 3740, "line_gross" => 20000]]];
            $xml = wsm_ksef_xml($p, $inv, "2026-08-06T10:00:00+02:00");
            libxml_use_internal_errors(true);
            $doc = simplexml_load_string($xml);
            $bien = $doc !== false && $doc->getName() === "Faktura";
            $ns   = str_contains($xml, WSM_KSEF_NS);
            $tot  = str_contains($xml, "<P_15>200.00</P_15>");
            $esc  = str_contains($xml, "Kowalski &amp; Synowie");
            $wolne = wsm_ksef_blockers($p, $inv) === [];
            $par  = wsm_ksef_blockers($p, ["kind" => "paragon"] + $inv);
            $pro  = wsm_ksef_blockers($p, ["kind" => "proforma"] + $inv);
            $juz  = wsm_ksef_blockers($p, ["ksef_number" => "X-1"] + $inv);
            echo ($bien ? "xml-ok" : "xml-ZLE"), " ", ($ns ? "ns-ok" : "ns-ZLE"), " ",
                 ($tot ? "suma-ok" : "suma-ZLE"), " ", ($esc ? "escape-ok" : "escape-ZLE"), " ",
                 ($wolne ? "czysta-ok" : "czysta-ZLE"), " ",
                 (count($par) === 1 ? "paragon-odmowa-ok" : "paragon-ZLE"), " ",
                 (count($pro) === 1 ? "proforma-odmowa-ok" : "proforma-ZLE"), " ",
                 ($juz !== [] ? "duplikat-odmowa-ok" : "duplikat-ZLE");
          ' 2>&1)
          echo "  $DOUT"
          case "$DOUT" in
            nie-sprawdzono*) echo "  nie sprawdzono (brak sqlite w php-cli) — nie liczy się jako zielone" ;;
            *ZLE*|*Error*|*error*) echo "  ^ NOT OK"; fail=1 ;;
          esac

          echo "== kolumny KSeF w bazie =="
          # Sans ces colonnes, le numéro renvoyé par le registre nirait nulle
          # part — et lidempotence, qui repose sur ksef_number, nexisterait pas.
          COLS=$(mysql -u"$DB_USER" -p"$DB_PASS" -N -B mrszoko -e \
            "SELECT COUNT(*) FROM information_schema.columns
              WHERE table_schema='mrszoko' AND table_name='wsm_invoices'
                AND column_name IN ('ksef_number','ksef_status','ksef_at');" 2>/dev/null || echo 0)
          [ "${COLS:-0}" = "3" ] \
            && echo "  ksef_number / ksef_status / ksef_at : obecne" \
            || { echo "  ^ ZLE : brakuje kolumn KSeF (znaleziono ${COLS:-0}/3)"; fail=1; }

          echo "== ekran odpowiada =="
          # Sans session, la console redirige vers sa page de connexion. Ce
          # qui compte ici : pas de 500. Une page qui explose ne redirige pas.
          #
          # -L n'est PAS un détail. Ce serveur impose HTTPS, donc toute URL en
          # http reçoit d'abord un 301 — sans suivre, on lit 301 partout et on
          # conclut à une panne qui n'existe pas. C'est ce que font les autres
          # étapes de vérification, et ne pas le faire ici a fait échouer le
          # déploiement 76 sur un faux motif, à côté d'un vrai.
          KCODE=$(curl -skL -o /dev/null -w "%{http_code}" "http://localhost/mrszoko/backoffice/ksef.php")
          echo "  ksef.php → $KCODE"
          case "$KCODE" in
            200|302|303) echo "  ok" ;;
            *) echo "  ^ NOT OK"; fail=1 ;;
          esac

          if [ "$fail" = "0" ]; then echo "ALL KSEF CHECKS OK"; else echo "KSEF CHECK FAILED"; exit 1; fi
          REMOTE


      # Nettoyage transitoire : avant cette version, le back-office était servi À
      # PLAT sous /mrszoko/ (index.html, support.js, api/…). rsync tourne sans
      # --delete, donc ces fichiers resteraient servis à côté du nouveau layout
      # backoffice/ + landing/. On les retire — liste blanche explicite, jamais de
      # rm générique — et SEULEMENT après que la vérif ci-dessus est passée.
      # Idempotent ; l'étape pourra être retirée une fois passée en prod.
      - name: Remove the old flat layout at /mrszoko root (post-verify)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          DIR="${{ vars.DEPLOY_DIR || '/var/www/html/mrszoko' }}"
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s << REMOTE
          set -u
          DIR='$DIR'
          for f in back_office_ws_franchisor.dc.html api-config.js support.js \
                   bo_server.js menu_api.js menu_seed.js .nojekyll \
                   _ds vendor img api mrszoko; do
            if [ -e "\$DIR/\$f" ]; then rm -rf "\${DIR:?}/\$f" && echo "supprimé : \$DIR/\$f"; fi
          done
          echo "reste à la racine :"; ls -1 "\$DIR"
          REMOTE

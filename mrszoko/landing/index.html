<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Aucun texte en dur : tout le contenu vient de l'API (wsm_landing_i18n /
     wsm_landing_products) avec repli sur content_seed.json — voir app.js. -->
<title>Mister Szoko</title>
<meta name="description" content="">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="alternate" hreflang="pl" href="?lang=pl">
<link rel="alternate" hreflang="uk" href="?lang=uk">
<link rel="alternate" hreflang="en" href="?lang=en">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ==========================================================
     Mister Szoko — landing. Composée uniquement avec les tokens
     du design system (tokens.css) : chocolat/crème/caramel,
     Plus Jakarta Sans + Mulish + DM Mono, coins doux, ombres
     chaudes, motion « melt ». Texte : 100 % data-driven.
     ========================================================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    font-size: var(--text-md);
    line-height: var(--leading-normal);
    color: var(--text-body);
    background: var(--bg-page);
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }

  .container { max-width: var(--container); margin: 0 auto; padding-left: var(--space-6); padding-right: var(--space-6); }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
  }

  /* ---- Boutons (pilule, hover lift + darken, press settle) ---- */
  .btn {
    display: inline-flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-bold);
    padding: 13px 26px; border-radius: var(--radius-pill); border: 1px solid transparent;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease-out),
                transform var(--dur-fast) var(--ease-soft),
                box-shadow var(--dur-base) var(--ease-out);
  }
  .btn:hover { transform: var(--lift); box-shadow: var(--shadow-md); }
  .btn:active { transform: translateY(0) scale(0.98); box-shadow: var(--shadow-sm); }
  .btn:focus-visible { outline: none; box-shadow: var(--ring); }
  .btn--accent { background: var(--accent); color: var(--text-on-accent); }
  .btn--accent:hover { background: var(--accent-hover); }
  .btn--brand { background: var(--brand); color: var(--cream-50); }
  .btn--brand:hover { background: var(--brand-hover); }
  .btn--ghost-dark { background: transparent; color: var(--cream-100); border-color: var(--choco-500); }
  .btn--ghost-dark:hover { background: var(--choco-800); }

  /* ---- Header ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--cream-50) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .header-in { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); padding-top: 14px; padding-bottom: 14px; }
  .header-logo { height: 44px; width: auto; }
  nav { display: flex; align-items: center; gap: var(--space-6); }
  nav a.navlink {
    font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-body);
    padding-bottom: 2px; border-bottom: 2px solid transparent;
    transition: color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
  }
  nav a.navlink:hover { color: var(--text-strong); border-bottom-color: var(--accent); }

  /* ---- Sélecteur de langue (pilules mono) ---- */
  .langs { display: inline-flex; gap: 2px; border: 1px solid var(--border-default); border-radius: var(--radius-pill); padding: 3px; }
  .langs button {
    font-family: var(--font-mono); font-size: var(--text-2xs); font-weight: 500;
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    border: none; background: transparent; color: var(--text-muted);
    padding: 5px 10px; border-radius: var(--radius-pill); cursor: pointer;
    transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
  }
  .langs button:hover { color: var(--text-strong); }
  .langs button[aria-current="true"] { background: var(--brand); color: var(--cream-50); }

  /* ---- Hero (panneau chocolat, filigrane logo) ---- */
  .hero { background: var(--choco-900); color: var(--cream-50); position: relative; overflow: hidden; }
  .hero-watermark {
    position: absolute; right: -140px; top: 50%; transform: translateY(-50%);
    width: 560px; height: auto; opacity: 0.05; pointer-events: none; user-select: none;
  }
  .hero-in { position: relative; padding-top: var(--space-10); padding-bottom: var(--space-10); }
  .hero .eyebrow { color: var(--caramel-400); margin-bottom: var(--space-5); }
  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, var(--text-4xl));
    line-height: var(--leading-tight); letter-spacing: var(--tracking-tight);
    font-weight: var(--weight-semibold); max-width: 640px; margin-bottom: var(--space-4);
  }
  .hero p.lead { color: var(--cream-200); max-width: 500px; margin-bottom: var(--space-6); }
  .hero-ctas { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
  .hero-strip { border-top: 1px solid var(--choco-700); }
  .hero-strip-in {
    display: flex; gap: var(--space-8); flex-wrap: wrap;
    padding-top: var(--space-4); padding-bottom: var(--space-4);
    font-family: var(--font-mono); font-size: var(--text-xs);
    letter-spacing: var(--tracking-wide); color: var(--choco-300);
  }

  /* ---- Sections ---- */
  section.block { padding-top: var(--space-9); padding-bottom: var(--space-9); }
  .section-head { margin-bottom: var(--space-6); }
  .section-head .eyebrow { color: var(--caramel-600); margin-bottom: var(--space-2); }
  .section-head h2 {
    font-family: var(--font-display); font-size: var(--text-2xl);
    color: var(--text-strong); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight);
  }
  .section-head p.sub { color: var(--text-muted); margin-top: var(--space-2); max-width: 560px; }

  /* ---- Cartes gamme ---- */
  .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--space-4); }
  .pcard {
    background: var(--surface-card); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column;
    box-shadow: var(--shadow-sm);
    transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
  }
  .pcard:hover { transform: var(--lift); box-shadow: var(--shadow-md); border-color: var(--choco-400); }
  .pcard-photo { aspect-ratio: 5 / 3; display: grid; place-items: center; }
  .pcard-photo span { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: rgba(251, 246, 239, 0.55); }
  .pcard-body { padding: var(--space-4) var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-2); flex: 1; }
  .pcard-meta { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); }
  .pcard h3 { font-family: var(--font-display); font-size: var(--text-lg); color: var(--text-strong); font-weight: var(--weight-semibold); }
  .pcard .specs { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }
  .pcard .price {
    margin-top: auto; padding-top: var(--space-3); border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--font-mono); font-size: var(--text-sm); color: var(--price);
  }
  .pcard .price .ht { font-size: var(--text-2xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .pcard .price .perkg { font-size: var(--text-2xs); color: var(--caramel-600); }
  .dots { display: inline-flex; gap: 4px; align-items: center; }
  .dots i { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--cream-300); }
  .dots i.on { background: var(--choco-600); }

  /* ---- Formats dégressifs ---- */
  .formats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); }
  .format {
    background: var(--surface-raised); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: var(--space-5);
  }
  .format .fk { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--caramel-600); }
  .format .fs { font-family: var(--font-display); font-size: var(--text-xl); color: var(--text-strong); font-weight: var(--weight-semibold); margin: var(--space-2) 0 var(--space-1); }
  .format p { font-size: var(--text-sm); color: var(--text-muted); }

  /* ---- Panneau pro (chocolat plein) ---- */
  .pro { background: var(--choco-800); color: var(--cream-50); border-radius: var(--radius-2xl); overflow: hidden; }
  .pro-in { padding: var(--space-8); display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); flex-wrap: wrap; }
  .pro h2 { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); margin-bottom: var(--space-2); }
  .pro p { color: var(--cream-200); max-width: 520px; }

  /* ---- Footer ---- */
  footer { background: var(--choco-950); color: var(--choco-300); margin-top: var(--space-10); }
  .footer-in { padding-top: var(--space-8); padding-bottom: var(--space-8); display: flex; justify-content: space-between; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; }
  footer .flogo { height: 40px; width: auto; opacity: 0.9; margin-bottom: var(--space-3); }
  footer .fmono { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-wide); }
  footer a { border-bottom: 1px solid var(--choco-700); padding-bottom: 1px; transition: color var(--dur-base) var(--ease-out); }
  footer a:hover { color: var(--cream-100); }
  .footer-base { border-top: 1px solid var(--choco-800); }
  .footer-base-in { padding-top: var(--space-4); padding-bottom: var(--space-4); display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-wide); color: var(--choco-400); }

  @media (max-width: 640px) {
    nav a.navlink { display: none; }
    .hero-watermark { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .btn, .pcard, nav a.navlink, footer a, .langs button { transition: none; }
    .btn:hover, .pcard:hover { transform: none; }
  }
</style>
</head>
<body>

<noscript>
  <p style="padding:16px;text-align:center;font-family:monospace">
    Ta strona wymaga JavaScript. · Ця сторінка потребує JavaScript. · This page requires JavaScript.
  </p>
</noscript>

<header>
  <div class="container header-in">
    <a id="home-link" href="#top"><img class="header-logo" src="assets/logo.png" alt="Mister Szoko"></a>
    <nav id="main-nav">
      <a class="navlink" href="#gamme" data-i18n="nav.range"></a>
      <a class="navlink" href="#formats" data-i18n="nav.formats"></a>
      <a class="navlink" href="#atelier" data-i18n="nav.atelier"></a>
      <a class="btn btn--accent" href="../shop/" data-i18n="nav.shop"></a>
      <a class="btn btn--brand" href="#pro" data-i18n="nav.pro"></a>
      <div class="langs" id="lang-switch" role="group"></div>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ===================== HERO ===================== -->
  <section class="hero">
    <img class="hero-watermark" src="assets/logo.png" alt="" aria-hidden="true">
    <div class="container hero-in">
      <div class="eyebrow" data-i18n="hero.eyebrow"></div>
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="hero-ctas">
        <a class="btn btn--accent" href="#gamme" data-i18n="hero.cta1"></a>
        <a class="btn btn--ghost-dark" href="#pro" data-i18n="hero.cta2"></a>
      </div>
    </div>
    <div class="hero-strip">
      <div class="container hero-strip-in">
        <span data-i18n="strip.1"></span>
        <span data-i18n="strip.2"></span>
        <span data-i18n="strip.3"></span>
      </div>
    </div>
  </section>

  <!-- ===================== GAMME ===================== -->
  <section class="block" id="gamme">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow" data-i18n="range.eyebrow"></div>
        <h2 data-i18n="range.title"></h2>
        <p class="sub" data-i18n="range.sub"></p>
      </div>
      <div class="grid-products" id="grid-products"></div>
    </div>
  </section>

  <!-- ===================== FORMATS ===================== -->
  <section class="block" id="formats" style="background: var(--surface-card); border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow" data-i18n="formats.eyebrow"></div>
        <h2 data-i18n="formats.title"></h2>
        <p class="sub" data-i18n="formats.sub"></p>
      </div>
      <div class="formats" id="grid-formats"></div>
    </div>
  </section>

  <!-- ===================== ATELIER ===================== -->
  <section class="block" id="atelier">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow" data-i18n="atelier.eyebrow"></div>
        <h2 data-i18n="atelier.title"></h2>
        <p class="sub" data-i18n="atelier.sub"></p>
      </div>
      <div class="section-head" style="margin-bottom: 0;">
        <p class="sub" style="font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-wide); color: var(--ink-500);" data-i18n="atelier.tagline"></p>
      </div>
    </div>
  </section>

  <!-- ===================== PRO ===================== -->
  <section class="block" id="pro" style="padding-top: 0;">
    <div class="container">
      <div class="pro">
        <div class="pro-in">
          <div>
            <div class="eyebrow" style="color: var(--caramel-400); margin-bottom: var(--space-2);" data-i18n="pro.eyebrow"></div>
            <h2 data-i18n="pro.title"></h2>
            <p data-i18n="pro.text"></p>
          </div>
          <a class="btn btn--accent" id="pro-cta" href="#" data-i18n="pro.cta"></a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="container footer-in">
    <div>
      <img class="flogo" src="assets/logo.png" alt="Mister Szoko">
      <p class="fmono" data-i18n="footer.tagline"></p>
    </div>
    <div class="fmono" style="display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-end;">
      <a id="footer-email" href="#" data-i18n="footer.email"></a>
      <a href="../backoffice/" data-i18n="footer.console"></a>
    </div>
  </div>
  <div class="footer-base">
    <div class="container footer-base-in">
      <span data-i18n="footer.copyright"></span>
      <span data-i18n="footer.note"></span>
    </div>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>

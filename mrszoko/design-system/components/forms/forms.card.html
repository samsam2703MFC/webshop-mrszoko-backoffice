<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, QuantityStepper, Icon } = window.MisterSzokoDesignSystem_613e75;
function Demo(){
  const [qty,setQty]=React.useState(3);
  return (
    <div className="grid">
      <Input label="Email address" placeholder="you@example.com" icon={<Icon name="user" size={18}/>} />
      <Select label="Gift box size" options={['4 pieces','9 pieces','16 pieces']} />
      <div>
        <div style={{fontSize:14,fontWeight:600,color:'var(--text-strong)',marginBottom:8}}>Quantity</div>
        <QuantityStepper value={qty} onChange={setQty} />
      </div>
      <Input label="Postcode" placeholder="1011 AB" error="Required for delivery" />
      <Input label="Search" placeholder="Search bars…" icon={<Icon name="search" size={18}/>} />
      <div>
        <div style={{fontSize:14,fontWeight:600,color:'var(--text-strong)',marginBottom:8}}>Small</div>
        <QuantityStepper value={1} size="sm" onChange={()=>{}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>

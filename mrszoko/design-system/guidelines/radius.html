<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="Soft, pebble-like — nothing sharp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);padding:22px;font-family:var(--font-mono)}.row{display:flex;gap:16px;align-items:flex-end}.b{width:92px;height:92px;background:var(--choco-700);color:var(--cream-100);font-size:10px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box}</style></head>
<body><div class="row">
<div class="b" style="border-radius:var(--radius-sm)">sm 8</div>
<div class="b" style="border-radius:var(--radius-md)">md 12</div>
<div class="b" style="border-radius:var(--radius-lg)">lg 18</div>
<div class="b" style="border-radius:var(--radius-xl)">xl 26</div>
<div class="b" style="border-radius:var(--radius-pill)">pill</div>
<div class="b" style="border-radius:var(--radius-blob)">blob</div>
</div></body></html>
